{{define "reset_password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Brand}}{{.Brand}}{{else}}AIO MDM{{end}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/Poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css?v={{.AssetVer}}">
  <link rel="stylesheet" href="/static/style.css?v={{.AssetVer}}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="login-title">{{if .Brand}}{{.Brand}}{{else}}<span class="brand-aio">AIO</span> <span class="brand-hub">MDM</span>{{end}}</h1>
    <p class="login-subtitle">Choose a new password</p>

    {{if .Invalid}}
    <div class="alert alert-error" role="alert">This reset link is invalid or has expired.</div>
    <p class="muted small" style="text-align:center;"><a href="/forgot-password">Request a new link</a></p>
    {{else}}
    {{if .Error}}
    <div class="alert alert-error" role="alert">{{.Error}}</div>
    {{end}}
    <form action="/reset-password" method="POST" class="login-form">
      <input type="hidden" name="token" value="{{.Token}}">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary" style="align-self:stretch;padding:11px;">Reset password</button>
    </form>
    {{end}}
  </div>
</body>
</html>
{{end}}
