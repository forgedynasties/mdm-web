{{define "demo_updates.html"}}
{{template "header" .}}

<style>
.dmu-wrap{max-width:820px;margin:0 auto}
.dmu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
@media(max-width:720px){.dmu-grid{grid-template-columns:1fr}}
.dmu-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-4);box-shadow:var(--shadow-sm);padding:16px 18px;text-decoration:none;color:inherit;display:block;transition:border-color .12s,box-shadow .12s}
.dmu-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md,var(--shadow-sm))}
.dmu-card h3,.dmu-card h2{font-size:14.5px;font-weight:700;margin:0 0 6px}
.dmu-card p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
</style>

<div class="dmu-wrap">
  <div class="ov-greet">
    <h1 class="ov-title">Demo — Updates</h1>
    <span class="ov-date">preview the deployment detail page against a few different device-status shapes</span>
    <span class="acts"><a href="/updates" class="btn-outline">Updates →</a></span>
  </div>

  <div class="dmu-grid">
    {{range .Scenarios}}
    <a class="dmu-card" href="/demo/updates/{{.Key}}">
      <h2>{{.Title}}</h2>
      <p>{{.Desc}}</p>
    </a>
    {{end}}
  </div>
</div>

{{template "footer" .}}
{{end}}
