<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Report — flagship — AIO MDM demo</title></head><body>
<style>
  :root{
    --bg:#f7f4ef; --surface:#fff; --surface2:#f6f3ee;
    --border:#e9e3da; --border-soft:#f0ebe3; --hair:#efe9e1;
    --text:#1b1917; --text2:#4b453d; --muted:#807971; --faint:#a8a096;
    --accent:#f9674e; --accent-h:#ec4f33; --accent-soft:rgba(249,103,78,.10);
    --p:#7a80f6; --p-soft:rgba(122,128,246,.13);
    --ok:#137a39; --ok-soft:rgba(19,122,57,.10); --ok-edge:rgba(19,122,57,.22);
    --warn:#b45309; --warn-soft:rgba(180,83,9,.11); --warn-edge:rgba(180,83,9,.24);
    --danger:#b42318; --danger-soft:rgba(180,35,24,.09); --danger-edge:rgba(180,35,24,.22);
    --font:"IBM Plex Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","IBM Plex Mono",Menlo,monospace;
    --sh:0 1px 2px rgba(27,25,23,.05),0 10px 30px rgba(27,25,23,.07);
    --sh-sm:0 1px 2px rgba(27,25,23,.05),0 2px 8px rgba(27,25,23,.05);
  }
  *{box-sizing:border-box}
  .wrap{margin:0;background:radial-gradient(1200px 500px at 70% -8%, #fbf6ef, var(--bg));color:var(--text);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 90px;min-height:100vh}
  h1,h2{margin:0;letter-spacing:-.015em;text-wrap:balance}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a.lnk{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s,color .15s}
  a.lnk:hover{color:var(--accent);border-bottom-color:var(--accent-soft)}

  .top{max-width:760px;margin:0 auto;padding:44px 24px 0}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.02em;margin-bottom:22px}
  .brand .a{background:linear-gradient(96deg,var(--accent),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .m{color:var(--muted);font-weight:600}
  .top h1{font-size:29px;font-weight:700}
  .top .lede{color:var(--muted);font-size:15px;margin-top:8px;max-width:60ch}
  .states{display:inline-flex;gap:4px;margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px;box-shadow:var(--sh-sm)}
  .states button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 16px;border-radius:99px;cursor:pointer;transition:background .15s,color .15s}
  .states button.on{background:var(--text);color:#fff}

  .stage{max-width:760px;margin:24px auto 0;padding:0 24px}

  /* ═══════════ THE CARD ═══════════ */
  .rc{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh);overflow:hidden;transition:box-shadow .3s}
  .rc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sig,var(--muted));transition:background .4s}

  /* header */
  .rc-h{display:flex;align-items:center;gap:11px;padding:16px 20px 15px;border-bottom:1px solid var(--hair)}
  .orb{position:relative;width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--p));box-shadow:0 5px 14px rgba(249,103,78,.30)}
  .orb svg{width:17px;height:17px}
  .orb::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--accent-soft);animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.9);opacity:.8}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
  .rc-h .ttl{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
  .rc-h .ttl .sub{display:block;font-size:11px;font-weight:500;color:var(--faint);letter-spacing:0;margin-top:1px}
  .rc-h .r{margin-left:auto;display:flex;align-items:center;gap:10px}
  .refresh{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 11px;cursor:pointer;transition:border-color .15s,color .15s}
  .refresh:hover{border-color:var(--accent);color:var(--accent)}
  .refresh svg{width:13px;height:13px}
  .analysis{font-size:12.5px;color:var(--muted);font-weight:500}
  .analysis:hover{color:var(--accent)}

  /* signal band + headline */
  .band{padding:20px 22px;background:var(--band,transparent);border-bottom:1px solid var(--hair);transition:background .4s}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sig);padding:0;margin-bottom:10px}
  .pill .glow{width:8px;height:8px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 3px color-mix(in srgb,var(--sig) 18%,transparent)}
  .headline{font-size:20px;line-height:1.32;font-weight:650;letter-spacing:-.015em;color:var(--text)}
  .headline .lnk{font-weight:650}

  /* metrics */
  .metrics{display:flex;padding:16px 22px;gap:0}
  .metric{flex:1;padding-right:20px}
  .metric + .metric{padding-left:20px;border-left:1px solid var(--hair)}
  .metric .mv{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;display:flex;align-items:baseline;gap:7px}
  .metric .mv .d{font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:0}
  .d.up{color:var(--danger);background:var(--danger-soft)} .d.dn{color:var(--warn);background:var(--warn-soft)} .d.gd{color:var(--ok);background:var(--ok-soft)}
  .metric .ml{font-size:11.5px;color:var(--muted);margin-top:7px}

  /* issues */
  .issues{padding:6px 16px 8px;display:flex;flex-direction:column;gap:9px}
  .iss{display:flex;gap:12px;padding:13px 14px;border-radius:12px;border:1px solid var(--border-soft);background:var(--surface);transition:box-shadow .2s,transform .2s,border-color .2s}
  .iss:hover{box-shadow:var(--sh-sm);transform:translateY(-1px)}
  .iss .ico{width:34px;height:34px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .iss .ico svg{width:17px;height:17px}
  .iss.warn .ico{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-edge)}
  .iss.crit .ico{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-edge)}
  .iss .body{min-width:0;flex:1}
  .iss .hd{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .iss .area{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  .iss.warn .area{color:var(--warn)} .iss.crit .area{color:var(--danger)}
  .iss .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
  .iss .scope{font-size:13.5px;font-weight:650}
  .iss .detail{font-size:13px;color:var(--text2);line-height:1.5}
  .iss .act{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--accent);font-weight:600;margin-top:8px;line-height:1.4}
  .iss .act svg{width:14px;height:14px;flex:none;margin-top:2px}

  /* healthy state */
  .allclear{display:flex;align-items:center;gap:14px;padding:22px}
  .allclear .ok-ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--ok-soft);border:1px solid var(--ok-edge);color:var(--ok);display:flex;align-items:center;justify-content:center}
  .allclear .ok-ic svg{width:22px;height:22px}
  .allclear .t{font-size:15px;font-weight:650}
  .allclear .d{font-size:13px;color:var(--muted);margin-top:2px}

  /* footer */
  .good{display:flex;align-items:center;gap:9px;margin:8px 16px 0;padding:11px 14px;background:var(--ok-soft);border:1px solid var(--ok-edge);border-radius:11px;font-size:12.5px;color:var(--ok)}
  .good svg{width:15px;height:15px;flex:none}
  .good b{font-weight:650}
  .foot{display:flex;align-items:center;gap:8px;padding:13px 22px 16px;font-size:11.5px;color:var(--faint)}
  .foot .modelchip{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border-soft);border-radius:99px;padding:2px 9px}
  .foot .modelchip .sp{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--p))}
  .foot .sepdot{width:3px;height:3px;border-radius:50%;background:var(--faint)}

  @media(prefers-reduced-motion:reduce){.orb::after{animation:none}}
  @media(max-width:560px){.metrics{flex-wrap:wrap;gap:14px}.metric+.metric{border-left:0;padding-left:0}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="a">AIO</span><span class="m">MDM</span></div>
    <h1>Daily Report — flagship card</h1>
    <p class="lede">One elevated design that reshapes itself to the fleet's state. Flip between the three health states to see how it reads.</p>
    <div class="states" id="states">
      <button data-s="warn" class="on">Watch</button>
      <button data-s="crit">Critical</button>
      <button data-s="ok">Healthy</button>
    </div>
  </div>

  <div class="stage">
    <div class="rc" id="card"></div>
  </div>
</div>

<script>
(function(){
  var ICON = {
    heat:'<path d="M14 4v10a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/>',
    charging:'<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 10v4"/><path d="M11 9l-2 3h3l-2 3"/>',
    offline:'<path d="M18.4 5.6a9 9 0 1 1-12.8 0"/><path d="M12 2v9"/>',
    memory:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>'
  };
  var SIG = { ok:['var(--ok)','linear-gradient(103deg,var(--ok-soft),transparent 58%)','ALL CLEAR'],
              warn:['var(--warn)','linear-gradient(103deg,var(--warn-soft),transparent 58%)','WATCH'],
              crit:['var(--danger)','linear-gradient(103deg,var(--danger-soft),transparent 58%)','AT-RISK'] };

  var DATA = {
    warn:{
      pill:'Watch · 2 call-outs',
      headline:'<a class="lnk" href="#">Downtown Diner</a> ran warm through dinner service — one unit worth a look, everything else steady.',
      metrics:[['38.7°C','Downtown Diner peak',['+6° vs norm','up']],['22%','charging coverage',['↓48pp','dn']],['57 / 58','reporting',null]],
      issues:[
        {sev:'warn',area:'heat',scope:'Downtown Diner',detail:'<a class="lnk mono" href="#">SN-003</a> held 38.7 °C for 18 min at the pass — 6° over its 7-day norm.',act:'Move the unit off the line or improve airflow before tomorrow’s service.'},
        {sev:'warn',area:'charging',scope:'Downtown Diner',detail:'coverage fell to 22% today vs ~70% typical — units run down between orders.',act:'Check the chargers on the pass are powered and seated.'}
      ],
      good:['San Jose Office','Airport Kiosk','Riverside Grill']
    },
    crit:{
      pill:'At-risk · 1 venue down',
      headline:'<a class="lnk" href="#">Tom’s Ducci 6th</a> has gone dark — 4 of 6 units silent for over five minutes. Treat the venue, not the tablets.',
      metrics:[['4 / 6','silent at venue',['critical','up']],['5 min','since last check-in',null],['54 / 58','reporting',null]],
      issues:[
        {sev:'crit',area:'offline',scope:'Tom’s Ducci 6th',detail:'<a class="lnk mono" href="#">AT-0031</a>, <a class="lnk mono" href="#">AT-0034</a>, <a class="lnk mono" href="#">AT-0037</a> and <a class="lnk mono" href="#">AT-0041</a> dropped inside the same 90-second window.',act:'Call the venue — a simultaneous drop points to power or the local network.'},
        {sev:'warn',area:'charging',scope:'Tom’s Ducci 6th',detail:'<a class="lnk mono" href="#">AT-0030</a> was at 14% and off charge when it last reported.',act:'Bring a charged spare when a tech rolls out.'}
      ],
      good:['San Jose Office','Airport Kiosk','Downtown Diner']
    },
    ok:{
      pill:'All clear',
      headline:'Fleet is healthy — all 58 units reporting, charged overnight, and nothing firing across the four restaurants.',
      metrics:[['100%','uptime',['+2pp','gd']],['91%','avg battery',['↑4','gd']],['0','open alerts',null]],
      issues:[],
      good:['Downtown Diner','Tom’s Ducci 6th','San Jose Office','Airport Kiosk']
    }
  };

  function goodLinks(list){ return list.map(function(n){ return '<a class="lnk" href="#">'+n+'</a>'; }).join(', '); }

  function render(state){
    var d=DATA[state], sig=SIG[state], card=document.getElementById('card');
    card.style.setProperty('--sig', sig[0]);
    card.style.setProperty('--band', sig[1]);

    var h = '';
    h += '<div class="rc-h">'
      +   '<span class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>'
      +   '<span class="ttl">Daily Report<span class="sub">Fleet briefing · today</span></span>'
      +   '<span class="r"><a class="analysis" href="#">Detailed analysis →</a><button class="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5"/><path d="M4 4v6h6"/><path d="M20 12a8 8 0 0 1-14 5"/><path d="M20 20v-6h-6"/></svg>Refresh</button></span>'
      + '</div>';

    h += '<div class="band"><div class="pill"><span class="glow"></span>'+d.pill+'</div><div class="headline">'+d.headline+'</div></div>';

    if(d.metrics && d.metrics.length){
      h += '<div class="metrics">';
      d.metrics.forEach(function(m){
        var delta = m[2] ? '<span class="d '+m[2][1]+'">'+m[2][0]+'</span>' : '';
        h += '<div class="metric"><div class="mv">'+m[0]+delta+'</div><div class="ml">'+m[1]+'</div></div>';
      });
      h += '</div>';
    }

    if(d.issues.length){
      h += '<div class="issues">';
      d.issues.forEach(function(is){
        h += '<div class="iss '+is.sev+'">'
          +  '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICON[is.area]||ICON.heat)+'</svg></span>'
          +  '<div class="body"><div class="hd"><span class="area">'+is.area+'</span><span class="dot"></span><span class="scope"><a class="lnk" href="#">'+is.scope+'</a></span></div>'
          +  '<div class="detail">'+is.detail+'</div>'
          +  '<div class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'+is.act+'</div></div>'
          +  '</div>';
      });
      h += '</div>';
      h += '<div class="good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span><b>Healthy elsewhere</b> — '+goodLinks(d.good)+'</span></div>';
    } else {
      h += '<div class="allclear"><span class="ok-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><div><div class="t">Nothing needs a look today</div><div class="d">All four restaurants — '+goodLinks(d.good)+' — are reporting normally.</div></div></div>';
    }

    h += '<div class="foot"><span class="modelchip"><span class="sp"></span>Claude Opus 4.8</span><span class="sepdot"></span><span>generated 5:02 PM</span><span class="sepdot"></span><span>read 58 devices · 4 venues</span></div>';

    card.innerHTML = h;
  }

  document.getElementById('states').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    render(b.dataset.s);
  });
  render('warn');
})();
</script>

</body></html>
