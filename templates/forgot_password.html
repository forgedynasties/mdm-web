{{define "forgot_password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Brand}}{{.Brand}}{{else}}AIO MDM{{end}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/Poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css?v={{.AssetVer}}">
  <link rel="stylesheet" href="/static/style.css?v={{.AssetVer}}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="login-title">{{if .Brand}}{{.Brand}}{{else}}<span class="brand-aio">AIO</span> <span class="brand-hub">MDM</span>{{end}}</h1>
    <p class="login-subtitle">Reset your password</p>

    {{if .Sent}}
    <div class="alert alert-success" role="alert">If that email has an account, we sent a reset link.</div>
    <p class="muted small" style="text-align:center;"><a href="/login">Back to sign in</a></p>
    {{else}}
    <form action="/forgot-password" method="POST" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn-primary" style="align-self:stretch;padding:11px;">Send reset link</button>
    </form>
    <p class="muted small" style="text-align:center;margin-top:14px;"><a href="/login">Back to sign in</a></p>
    {{end}}
  </div>
</body>
</html>
{{end}}
