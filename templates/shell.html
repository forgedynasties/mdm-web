{{define "shell.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — MDM</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mdm-theme');
        document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; background: var(--console-bg); }
    .shell-nav {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .shell-nav .shell-title {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: var(--fw-semibold); color: var(--text);
    }
    .shell-nav .shell-title .ui-icon { width: 16px; height: 16px; color: var(--accent); }
    .shell-nav .shell-serial { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .shell-status {
      margin-left: auto; font-size: var(--t-11); font-weight: var(--fw-medium);
      padding: 3px 10px; border-radius: 999px; border: 1px solid;
      font-family: var(--mono); letter-spacing: .02em; display: inline-flex; align-items: center; gap: 6px;
    }
    .shell-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .shell-status.connected    { color: var(--ok);     background: var(--ok-bg);     border-color: var(--ok-edge); }
    .shell-status.disconnected { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-edge); }
    .shell-status.connecting   { color: var(--muted);  background: var(--surface-3); border-color: var(--rule); }
    #terminal-wrap {
      flex: 1; overflow: hidden; padding: 10px 12px;
      background: var(--console-bg);
    }
    #terminal { height: 100%; }
  </style>
</head>
<body>
  <div class="shell-nav">
    <a href="/devices/{{.Serial}}" class="dd-icon-btn" title="Back to device" aria-label="Back to device"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="shell-title"><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l5 5-5 5"/><path d="M11 17h9"/></svg></span>Interactive Shell</span>
    <span class="shell-serial">{{.Serial}}</span>
    <span id="status" class="shell-status connecting">connecting…</span>
  </div>
  <div id="terminal-wrap">
    <div id="terminal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script>
  (function () {
    const serial = {{.Serial | printf "%q"}};
    const statusEl = document.getElementById('status');

    const term = new Terminal({
      cursorBlink: true,
      fontSize: 13,
      fontFamily: '"Cascadia Code", "Fira Code", monospace',
      theme: {
        background: '#0e1115',
        foreground: '#d6dbe2',
        cursor:     '#d6dbe2',
        black:      '#0e1115',
        brightBlack:'#3a4452',
      },
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    function setStatus(state, text) {
      statusEl.className = 'shell-status ' + state;
      statusEl.textContent = text;
    }

    let ws;
    let reconnectDelay = 1000;

    function connect() {
      setStatus('connecting', 'connecting…');
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws/shell/${serial}`);

      ws.onopen = () => {
        setStatus('connected', 'connected');
        reconnectDelay = 1000;
        sendResize();
      };

      ws.onmessage = (e) => {
        const frame = JSON.parse(e.data);
        if (frame.type === 'shell_output') {
          term.write(frame.data);
        } else if (frame.type === 'shell_exit') {
          term.write('\r\n\x1b[33m[shell exited]\x1b[0m\r\n');
          setStatus('disconnected', 'shell exited');
        }
      };

      ws.onclose = () => {
        setStatus('disconnected', 'disconnected — reconnecting in ' + (reconnectDelay / 1000) + 's');
        term.write('\r\n\x1b[31m[disconnected]\x1b[0m\r\n');
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
      };

      ws.onerror = () => ws.close();
    }

    function sendResize() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'shell_resize', cols: term.cols, rows: term.rows }));
      }
    }

    term.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'shell_stdin', data }));
      }
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      sendResize();
    });

    connect();
  })();
  </script>
</body>
</html>
{{end}}
