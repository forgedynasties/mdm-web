{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Brand}}{{.Brand}}{{else}}AIO Hub{{end}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/Poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css?v={{.AssetVer}}">
  <link rel="stylesheet" href="/static/style.css?v={{.AssetVer}}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="14" height="10" rx="2"/>
        <rect x="28" y="8" width="14" height="10" rx="2"/>
        <rect x="4" y="26" width="14" height="10" rx="2"/>
        <rect x="28" y="26" width="14" height="10" rx="2"/>
        <circle cx="22" cy="20" r="6"/>
        <path d="M19 19l2 2 4-4"/>
        <line x1="22" y1="26" x2="22" y2="42"/>
      </svg>
    </div>
    <h1 class="login-title">{{if .Brand}}{{.Brand}}{{else}}<span class="brand-aio">AIO</span> <span class="brand-hub">Hub</span>{{end}}</h1>
    <p class="login-subtitle">Device management dashboard</p>

    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <form action="/login" method="POST" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" style="align-self:stretch;padding:11px;">Sign In</button>
    </form>
  </div>
</body>
</html>
{{end}}
