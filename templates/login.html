{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Brand}}{{.Brand}}{{else}}AIO MDM{{end}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/Poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css?v={{.AssetVer}}">
  <link rel="stylesheet" href="/static/style.css?v={{.AssetVer}}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="login-title">{{if .Brand}}{{.Brand}}{{else}}<span class="brand-aio">AIO</span> <span class="brand-hub">MDM</span>{{end}}</h1>
    <p class="login-subtitle">Device management dashboard</p>

    {{if .Error}}
    <div class="alert alert-error" role="alert">{{.Error}}</div>
    {{end}}

    {{if msLoginEnabled}}
    <a href="/auth/microsoft" class="btn-outline" style="display:flex;align-items:center;justify-content:center;gap:9px;padding:10px;margin-bottom:16px;text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Sign in with Microsoft
    </a>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--muted);font-size:12px;">
      <span style="flex:1;height:1px;background:var(--border);"></span>or<span style="flex:1;height:1px;background:var(--border);"></span>
    </div>
    {{end}}

    <form action="/login" method="POST" class="login-form">
      <div class="form-group">
        <label for="username">Email</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" style="align-self:stretch;padding:11px;">Sign In</button>
    </form>
    <p class="muted small" style="text-align:center;margin-top:14px;"><a href="/forgot-password">Forgot password?</a> · <a href="/signup">Sign up</a></p>
  </div>
</body>
</html>
{{end}}
