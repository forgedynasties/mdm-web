{{define "restaurant_form.html"}}
{{template "header" .}}

<a href="{{if .Restaurant}}/restaurants/{{.Restaurant.ID}}{{else}}/restaurants{{end}}" class="back-link">← Back</a>
<div class="ov-greet">
  <h1 class="ov-title">{{.Title}}</h1>
</div>

<div class="card" style="max-width:660px;">
  <form action="{{if .Restaurant}}/restaurants/{{.Restaurant.ID}}{{else}}/restaurants{{end}}" method="POST"
        style="padding:20px;display:flex;flex-direction:column;gap:16px;">
    <div class="form-row">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-input" required autofocus
             placeholder="e.g. Downtown Diner — 5th Ave"
             value="{{with .Restaurant}}{{.Name}}{{end}}">
    </div>
    <div class="form-row">
      <label class="form-label">Address <span class="muted small">(optional)</span></label>
      <input type="text" name="address" class="form-input"
             placeholder="Street, city"
             value="{{with .Restaurant}}{{.Address}}{{end}}">
    </div>
    <div class="form-row">
      <label class="form-label">Location <span class="muted small">(optional)</span></label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span class="muted small">Latitude</span>
          <input type="number" id="rest-lat" name="latitude" class="form-input" step="any" min="-90" max="90" placeholder="37.7749"
                 style="width:150px;" value="{{with .Restaurant}}{{with .Latitude}}{{.}}{{end}}{{end}}">
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span class="muted small">Longitude</span>
          <input type="number" id="rest-lng" name="longitude" class="form-input" step="any" min="-180" max="180" placeholder="-122.4194"
                 style="width:150px;" value="{{with .Restaurant}}{{with .Longitude}}{{.}}{{end}}{{end}}">
        </div>
        <a id="rest-map-link" href="#" target="_blank" rel="noopener" class="btn-outline" style="display:none;">Open in maps ↗</a>
      </div>
      <div class="muted small" style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span>Paste coordinates to fill both:</span>
        <input type="text" id="rest-coord-paste" class="form-input" placeholder="37.7749, -122.4194" style="max-width:220px;">
        <a href="https://www.google.com/maps" target="_blank" rel="noopener" class="link">Find coordinates ↗</a>
      </div>
    </div>
    {{$tz := ""}}{{with .Restaurant}}{{$tz = .Timezone}}{{end}}
    <div class="form-row">
      <label class="form-label">Timezone <span class="muted small">(optional — used for this venue's service hours)</span></label>
      <select name="timezone" class="form-input">
        <option value="" {{if eq $tz ""}}selected{{end}}>Use each device's reported timezone</option>
        {{range $.Timezones}}
        <optgroup label="{{.Region}}">
          {{range .Zones}}
          <option value="{{.Value}}" {{if eq $tz .Value}}selected{{end}}>{{.Label}}</option>
          {{end}}
        </optgroup>
        {{end}}
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">Notes <span class="muted small">(optional)</span></label>
      <textarea name="notes" class="form-textarea" rows="3" style="resize:vertical;"
                placeholder="Anything ops should know about this venue…">{{with .Restaurant}}{{.Notes}}{{end}}</textarea>
    </div>
    <div>
      <button type="submit" class="btn-primary">{{if .Restaurant}}Save changes{{else}}Create restaurant{{end}}</button>
    </div>
  </form>
</div>

<script>
(function () {
  var lat = document.getElementById('rest-lat');
  var lng = document.getElementById('rest-lng');
  var paste = document.getElementById('rest-coord-paste');
  var link = document.getElementById('rest-map-link');
  if (!lat || !lng) return;
  function syncLink() {
    if (lat.value !== '' && lng.value !== '') {
      link.href = 'https://www.google.com/maps?q=' + encodeURIComponent(lat.value + ',' + lng.value);
      link.style.display = '';
    } else {
      link.style.display = 'none';
    }
  }
  if (paste) {
    paste.addEventListener('input', function () {
      var m = paste.value.split(',');
      if (m.length === 2) {
        var a = parseFloat(m[0].trim()), b = parseFloat(m[1].trim());
        if (!isNaN(a) && !isNaN(b)) { lat.value = a; lng.value = b; syncLink(); }
      }
    });
  }
  lat.addEventListener('input', syncLink);
  lng.addEventListener('input', syncLink);
  syncLink();
})();
</script>

{{template "footer" .}}
{{end}}
