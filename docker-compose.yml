services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8082}:8082"
    env_file: .env
    environment:
      DB_HOST: postgres
      # Persist the settings/config file on the data volume so all settings
      # survive container restarts and rebuilds (default config/ is not mounted).
      CONFIG_PATH: ${CONFIG_PATH:-/app/data/config.json}
    volumes:
      - splashdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  splashdata:
