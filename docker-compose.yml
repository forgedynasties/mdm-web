services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
      TZ:                UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    # Tuned for the t2.xlarge (16 GB, since 25 Sep 2026) that live and stage share with
    # other stacks; the defaults assumed a 128 MB buffer pool on a 1.2 GB database, so
    # most reads went to the OS. Stage keeps smaller numbers in its .env (PG_*).
    # A deploy that changes anything here restarts Postgres too: deploy.yml's
    # `compose up server` recreates a dependency whose config differs (seen on the
    # 28 Sep deploy, ~6 s without a database). Stage's PG_* must be in its .env
    # before that deploy, or stage comes up with live's sizes.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-3GB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_MEM:-256MB}
      - -c
      - work_mem=8MB
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
    # Parallel query workers share memory through /dev/shm; Docker's 64 MB default
    # fails a parallel hash join once the buffer pool is this size.
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-4g}

  server:
    # MDM_IMAGE is set by the deploy pipeline to an ECR tag, so the box runs an image
    # built on a runner instead of compiling here — a `go build` needs ~2GB and both
    # vCPUs, which is what repeatedly wedged this instance. Unset locally, so a plain
    # `docker compose up --build` still builds from source for development.
    image: ${MDM_IMAGE:-mdm-server-server}
    build: .
    restart: unless-stopped
    ports:
      # $PORT is NOT published here any more — the proxy service below owns the host
      # port and forwards to this container over the compose network. That is what
      # lets a restart of this service show a "deploying" page instead of the ALB's
      # raw 502: the proxy stays up while this container is recreated.
      # Legacy OTA listener (otautil on pre-agent builds has host:8000 baked in).
      # Only the /device/* routes answer here; see internal/api/legacy_ota.go.
      # Default 8010 so a stage instance never collides with the old ota-server on
      # 8000; the live cutover sets LEGACY_OTA_PORT=8000 in .env.
      - "${LEGACY_OTA_PORT:-8010}:${LEGACY_OTA_PORT:-8010}"
      # adb tunnels (internal/adbtunnel): the server binds one port per session inside
      # ADB_TUNNEL_PORTS, so the range is published 1:1 — the dashboard tells admins
      # the port the server bound. Set it in .env (a different range per stack on a
      # shared box: stage and live both live on one instance, and a fixed default here
      # made live fail to start because stage already held the ports) and open the
      # same range in the security group. Unset: a single ephemeral host port is mapped
      # (harmless, never collides) and the page offers no tunnels.
      - "${ADB_TUNNEL_PORTS:-0}:${ADB_TUNNEL_PORTS:-42000}"
    env_file: .env
    environment:
      # Was hardcoded to "postgres" (the local container), which silently overrode whatever
      # DB_HOST .env set — pointing a box at an external database (the shared RDS cluster)
      # needed this file edited too, not just .env, or the next deploy would revert it back
      # to the local container. Defaults to "postgres" so stage/local dev are unaffected.
      DB_HOST: ${DB_HOST:-postgres}
      # UTC everywhere so logged/stored timestamps are unambiguous across hosts.
      TZ: UTC
      # Persist the settings/config file on the data volume so all settings
      # survive container restarts and rebuilds (default config/ is not mounted).
      CONFIG_PATH: ${CONFIG_PATH:-/app/data/config.json}
      LEGACY_OTA_PORT: ${LEGACY_OTA_PORT:-8010}
      # Go sizes its heap against the HOST's RAM (3.9GB here), not the cgroup limit
      # below, so it grew straight through the old 512m cap and the kernel OOM-killed
      # it — twice, at ~520MB, during the 2026-09-23 deploy, while steady state is
      # ~70MB. Most of that was collectable garbage from the reconnect burst that the
      # GC had no reason to collect, because it could not see the cap.
      #
      # GOMEMLIMIT is a soft TARGET, not just a guard: the GC keeps the heap near it
      # and works harder as it approaches, instead of the process dying. So this is
      # the number we want it to use, not merely something under the cap — set it too
      # high and Go reserves that much on a box shared with Postgres and five other
      # stacks. 400MiB is ~6x the steady state with room for the startup burst; the
      # hard limit below sits above it for stacks and other non-heap memory.
      GOMEMLIMIT: ${GOMEMLIMIT:-400MiB}
      # Pass-through target for the legacy routes: the old ota-server, republished on
      # host port 8001 (host.docker.internal resolves to the docker host below).
      LEGACY_OTA_UPSTREAM: ${LEGACY_OTA_UPSTREAM:-http://host.docker.internal:8001}
      # AWS access (SES email, S3 APK uploads) comes from the EC2 instance role
      # (ec2-ssm), which the AWS SDK finds through the instance metadata service.
      # No keys in env and no credentials file: the ~/.aws mount this used to have was
      # empty on the box, because deploys run over SSM with no HOME and it resolved to
      # /.aws. It only works because the instance allows a metadata hop limit of 2
      # (a container is one hop further than the host); keep it at 2 or more.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - splashdata:/app/data
    # Give the server time to finish in-flight requests and drain WebSockets on
    # `docker compose down`/redeploy. The server closes its streams and device sockets
    # on SIGTERM and then drains ordinary requests, which takes milliseconds; 15s is the
    # backstop for a stuck handler, not the expected path. It used to be 30s to match a
    # 25s Shutdown that always ran to its timeout, and that wait WAS the deploy outage.
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Startup is the peak: migrations run while the whole fleet's WebSockets
          # reconnect at once. 512m was under that peak. This is the hard ceiling the
          # kernel enforces; GOMEMLIMIT above is what actually holds usage down.
          memory: ${MEM_LIMIT:-768m}

  # ── The front door ────────────────────────────────────────────────────────────
  # The ALB sends every request for mdm.dev.aioapp.com to this host on $PORT. It has
  # no notion of a custom error page: with its only target down it answers a raw 502,
  # which is what users saw for ~20s on each deploy, and for minutes when the server
  # was being OOM-killed.
  #
  # nginx owns that host port instead and forwards to the server over the compose
  # network. `docker compose up -d --force-recreate server` never touches this
  # container, so while the server is being replaced nginx is still there to answer —
  # and it answers 502/503/504 from upstream with the deploying page below. That
  # covers an unplanned crash exactly as well as a planned deploy.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # No `condition: service_healthy` on purpose: the proxy must come up even when
    # the server will not, since that is precisely when the page is needed.
    depends_on:
      - server
    ports:
      - "${PORT:-8082}:80"
    configs:
      - source: proxy_conf
        target: /etc/nginx/conf.d/default.conf
    deploy:
      resources:
        limits:
          memory: 64m

configs:
  proxy_conf:
    # Inline rather than a mounted file: the deploy ships only docker-compose.yml over
    # SSM, so a separate nginx.conf on disk would go stale the moment anyone edited it
    # here. $$ escapes a literal $ for nginx — a single $ is compose interpolation.
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        ''      close;
      }

      # Docker's embedded DNS. A plain `upstream` block resolves once at startup,
      # which breaks this twice over: nginx refuses to start at all when the server
      # container is absent (exactly when the page is needed), and after a recreate
      # the server has a NEW container IP while nginx keeps dialling the dead one —
      # a permanent 502 that only an nginx restart clears. Resolving through a
      # variable defers the lookup to request time, so neither happens.
      resolver 127.0.0.11 valid=10s ipv6=off;
      # Both of these default absurdly high for our purpose (30s and 60s). While the
      # server container is gone the name does not resolve and nothing accepts on the
      # port, and with the defaults nginx sits there for tens of seconds before it
      # concludes the upstream is unreachable — so the user gets a long hang and only
      # then the deploying page. Failing fast is the whole point: worst case ~4s.
      resolver_timeout 2s;

      server {
        listen 80;

        # Buffering off so live logcat, remote screen and SSE stream rather than stall.
        proxy_buffering off;
        # 60s, NOT an hour. An hour here means a request that reached the OUTGOING
        # container just as it got SIGTERM hangs for the whole of its 15s
        # stop_grace_period and beyond, instead of falling through to the deploying
        # page — measured at 6.7s, 13.1s and one 20s timeout on stage. The dashboard's
        # SSE streams heartbeat every 25s (": keep-alive"), so 60s is comfortably
        # clear of them. The device WebSocket gets its own block below.
        # 30s is a deliberate floor, not a round number: the dashboard's SSE streams
        # heartbeat every 25s (": keep-alive"), so anything at or under that kills
        # them. It is the ceiling on the one case nginx cannot avoid — a request
        # ACCEPTED by the outgoing container microseconds before Go closes its
        # listener, which then goes unanswered for the whole stop_grace_period drain
        # ("upstream prematurely closed connection" in the error log). Refused
        # connections, which is almost all of them, still hit the page in ~1ms.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Connect is a different matter from read: a live WebSocket may idle for an
        # hour, but establishing the TCP connection should never take seconds. This is
        # what decides how fast a user sees the deploying page.
        proxy_connect_timeout 2s;

        # APK and OTA uploads go through here. nginx defaults to a 1m body limit,
        # which would reject them with 413 — 0 disables the check entirely.
        client_max_body_size 0;
        client_body_timeout 300s;

        # Device WebSockets idle far longer than any dashboard request, so they keep
        # the long timeout. Narrow prefix on purpose: everything else must stay fast
        # to fail.
        location /api/v1/adb-tunnel/ {
          set $$apptun server:${PORT:-8082};
          proxy_pass http://$$apptun$$request_uri;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          error_page 502 503 504 = @deploying;
        }

        location = /api/v1/ws {
          set $$appws server:${PORT:-8082};
          proxy_pass http://$$appws$$request_uri;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          error_page 502 503 504 = @deploying;
        }

        location / {
          # $$request_uri is required: a variable in proxy_pass stops nginx passing
          # the path through for you, so without it every request lands on /.
          set $$app server:${PORT:-8082};
          proxy_pass http://$$app$$request_uri;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;

          proxy_next_upstream off;
          error_page 502 503 504 = @deploying;
        }

        # /health stays honest: it proxies through, and reports 503 when the server is
        # down. Answering 200 from nginx here would keep the ALB happy but would also
        # hide a real outage from every uptime check we have — including the one that
        # caught the OOM flapping.
        location = /health {
          set $$apphc server:${PORT:-8082};
          proxy_pass http://$$apphc$$request_uri;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          error_page 502 503 504 = @health_down;
        }
        location @health_down {
          default_type application/json;
          add_header Cache-Control "no-store" always;
          return 503 '{"status":"deploying"}';
        }

        location @deploying {
          default_type text/html;
          add_header Retry-After 10 always;
          add_header Cache-Control "no-store, must-revalidate" always;
          return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>Deploying</title><style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8f5;color:#141210;font:400 16px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}@media(prefers-color-scheme:dark){body{background:#141210;color:#faf8f5}}.w{max-width:26rem;padding:2rem;text-align:center}h1{margin:0 0 .5rem;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}p{margin:0;opacity:.7;font-size:.95rem}.d{display:flex;gap:.4rem;justify-content:center;margin-bottom:1.5rem}.d i{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;opacity:.25;animation:b 1.4s infinite}.d i:nth-child(2){animation-delay:.2s}.d i:nth-child(3){animation-delay:.4s}@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:.9}}</style></head><body><div class="w"><div class="d"><i></i><i></i><i></i></div><h1>Deploying a new version</h1><p>This takes a few seconds. The page refreshes itself.</p></div></body></html>';
        }
      }

volumes:
  pgdata:
  splashdata:
