# Deploy the MDM to the EC2 box: live or stage, picked from a dropdown.
#
#   live  = the `main` branch   -> /home/ubuntu/mdm        (the restaurant fleet)
#   stage = the `stage` branch  -> /home/ubuntu/stage-mdm  (mdm-stage.dev.aioapp.com)
#
# Each target is tied to its branch and directory here, so a run can no longer put
# `main` into the stage directory (or anything into live by mistyping a path). Manual
# only: pushing builds an image (build.yml, for main) but never restarts anything.
#
# The image is the one for the branch's latest commit, or for an older commit given in
# `sha` (rollback). If ECR has no image for that commit yet (stage commits, which
# build.yml does not publish), this workflow builds and pushes it first.
#
# The box runs a compose stack — the server needs the Postgres container on the same
# compose network (DB_HOST=postgres), two published ports and the splashdata volume — so
# this pulls the image and brings the service up through compose rather than `docker run`.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy: live (main branch) or stage (stage branch)"
        required: true
        type: choice
        options:
          - stage
          - live
        default: stage
      sha:
        description: "Optional: an older commit of that branch to deploy (rollback). Empty = the branch's latest commit."
        required: false
        default: ""

env:
  AWS_REGION: us-west-2
  GO_VERSION: "1.24"

# One deploy per target at a time; a stage deploy never waits on a live one.
concurrency:
  group: deploy-${{ inputs.target }}

jobs:
  resolve:
    name: Resolve ${{ inputs.target }}
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.t.outputs.branch }}
      app_dir: ${{ steps.t.outputs.app_dir }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: t
        run: |
          case "${{ inputs.target }}" in
            live)  echo "branch=main"  >> "$GITHUB_OUTPUT"; echo "app_dir=/home/ubuntu/mdm"       >> "$GITHUB_OUTPUT" ;;
            stage) echo "branch=stage" >> "$GITHUB_OUTPUT"; echo "app_dir=/home/ubuntu/stage-mdm" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown target"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.branch }}
          fetch-depth: 0

      - id: sha
        # A given sha must be on the target's branch: a rollback cannot smuggle another
        # branch's commit into live or stage.
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            full=$(git rev-parse --verify "${{ inputs.sha }}^{commit}")
            git merge-base --is-ancestor "$full" HEAD || {
              echo "::error::${{ inputs.sha }} is not on ${{ steps.t.outputs.branch }}"; exit 1; }
          else
            full=$(git rev-parse HEAD)
          fi
          echo "sha=$full" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ inputs.target }}: ${{ steps.t.outputs.branch }} @ $full"

  image:
    name: Ensure image
    needs: resolve
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: exists
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids imageTag="${{ needs.resolve.outputs.sha }}" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "Image already in ECR"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"; echo "No image yet: building it"
          fi

      - if: steps.exists.outputs.found != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - if: steps.exists.outputs.found != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        if: steps.exists.outputs.found != 'true'
        # Same gate as build.yml, with the same known-broken test skipped.
        run: go build ./... && go test ./... -skip 'TestVisibleIDsAndHiding'

      - if: steps.exists.outputs.found != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.resolve.outputs.sha }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.resolve.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.target }}
    needs: [resolve, image]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      # Check out the very commit being deployed, so the compose file shipped below
      # matches the image. The box has its own (now stale) git checkout, and relying on
      # it meant compose read an old file with no `image:` line, ignored MDM_IMAGE and
      # restarted the locally built image while reporting success.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.resolve.outputs.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ needs.resolve.outputs.app_dir }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail

          # Ship the compose file with the deploy, base64'd so no quoting can mangle it.
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          REMOTE=$(cat <<EOF
          set -eu
          cd "$APP_DIR"

          # Keep a copy of whatever is there, then install the version that belongs to
          # this image. Without this the box decides which compose file to run, and it
          # has no way of knowing the image name changed.
          cp -f docker-compose.yml docker-compose.yml.bak 2>/dev/null || true
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          # Persist the tag in .env so a reboot or a manual 'docker compose up' brings
          # back the same image instead of trying to compile on the box.
          if grep -q '^MDM_IMAGE=' .env; then
            sed -i "s|^MDM_IMAGE=.*|MDM_IMAGE=$IMAGE|" .env
          else
            echo "MDM_IMAGE=$IMAGE" >> .env
          fi

          # --force-recreate matters with a floating tag like :main. compose decides
          # whether to restart by comparing the image NAME in its config, not the digest
          # it resolves to — so a second deploy of ':main' pulled the new image and then
          # left the old container running, reporting success. Deploying a SHA avoids
          # this by changing the name, but the flag makes either form correct.
          #
          # --no-build is the other safety net: if the image were somehow missing, compose
          # would otherwise fall back to compiling here, which is the whole problem.
          docker compose up -d --no-build --force-recreate server

          # Wait for the container to report healthy rather than declaring success the
          # moment it starts.
          # Ask compose which container it just started — the project name differs
          # between the live and stage directories, so nothing here is hardcoded.
          cid=\$(docker compose ps -q server)
          for i in \$(seq 1 30); do
            state=\$(docker inspect -f '{{.State.Health.Status}}' "\$cid" 2>/dev/null || echo starting)
            [ "\$state" = "healthy" ] && break
            sleep 2
          done
          echo "health: \$state"
          running=\$(docker inspect -f '{{.Config.Image}}' "\$cid")
          echo "running image: \$running"
          # The deploy is only real if the container is on the image we just pulled.
          # This is exactly what silently failed twice: a green run over a stale image.
          if [ "\$running" != "$IMAGE" ]; then
            echo "ERROR: expected $IMAGE but the container is running \$running"
            exit 1
          fi
          echo "image digest:  \$(docker inspect -f '{{index .RepoDigests 0}}' "\$(docker inspect -f '{{.Image}}' "\$cid")" 2>/dev/null || echo n/a)"
          echo "started at:    \$(docker inspect -f '{{.State.StartedAt}}' "\$cid")"
          docker compose ps
          docker image prune -f >/dev/null 2>&1 || true
          [ "\$state" = "healthy" ]
          EOF
          )

          PARAMS=$(jq -nc --arg s "$REMOTE" '{commands: [$s]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MDM ${{ needs.resolve.outputs.sha }}" \
            --parameters "$PARAMS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" --query "Status" --output text)

          echo "----- STDOUT -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" --query "StandardOutputContent" --output text
          echo "----- STDERR -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" --query "StandardErrorContent" --output text

          echo "Final SSM status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Summary
        if: always()
        run: |
          echo "Deployed **${{ inputs.target }}**: \`${{ needs.resolve.outputs.branch }}\` @ \`${{ needs.resolve.outputs.sha }}\` to \`${{ needs.resolve.outputs.app_dir }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back by re-running with an earlier commit of that branch in **sha**." >> "$GITHUB_STEP_SUMMARY"
