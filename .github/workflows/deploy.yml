# Deploy the MDM to the EC2 box: live or stage, picked from a dropdown.
#
#   live  = the `main` branch   -> /home/ubuntu/mdm        (the restaurant fleet)
#   stage = the `stage` branch  -> /home/ubuntu/stage-mdm  (mdm-stage.dev.aioapp.com)
#
# Each target is tied to its branch and directory here, so a run can no longer put
# `main` into the stage directory (or anything into live by mistyping a path).
# Live is manual only. Stage also deploys itself on every push to `stage`, and a newer
# stage deploy cancels an older one still in flight, so a burst of pushes ends in one
# deploy of the latest commit instead of a queue.
#
# The image is the one for the branch's latest commit, or for an older commit given in
# `sha` (rollback). If ECR has no image for that commit yet (stage commits, which
# build.yml does not publish), this workflow builds and pushes it first.
#
# The box runs a compose stack — the server needs the Postgres container on the same
# compose network (DB_HOST=postgres), two published ports and the splashdata volume — so
# this pulls the image and brings the service up through compose rather than `docker run`.
name: Deploy

on:
  push:
    branches: [stage]
    paths-ignore: ["**.md", "docs/**", "tools/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy: live (main branch) or stage (stage branch)"
        required: true
        type: choice
        options:
          - stage
          - live
        default: stage
      sha:
        description: "Optional: an older commit of that branch to deploy (rollback). Empty = the branch's latest commit."
        required: false
        default: ""

env:
  AWS_REGION: us-west-2
  GO_VERSION: "1.24"
  # A push is always a stage deploy; a manual run uses the dropdown.
  TARGET: ${{ github.event_name == 'push' && 'stage' || inputs.target }}

# One deploy per target at a time; a stage deploy never waits on a live one. Stage
# cancels the older run (it is superseded anyway); live never cancels a deploy.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'stage' || inputs.target }}
  cancel-in-progress: ${{ (github.event_name == 'push' && 'stage' || inputs.target) == 'stage' }}

jobs:
  # Resolve the target and make sure ECR has an image for the commit. Compiles the
  # server here (warm Go cache) and wraps it in the runtime-only Dockerfile.ci.
  build:
    name: Build ${{ github.event_name == 'push' && 'stage' || inputs.target }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      branch: ${{ steps.t.outputs.branch }}
      app_dir: ${{ steps.t.outputs.app_dir }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: t
        run: |
          case "$TARGET" in
            live)  echo "branch=main"  >> "$GITHUB_OUTPUT"; echo "app_dir=/home/ubuntu/mdm"       >> "$GITHUB_OUTPUT" ;;
            stage) echo "branch=stage" >> "$GITHUB_OUTPUT"; echo "app_dir=/home/ubuntu/stage-mdm" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown target"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || steps.t.outputs.branch }}
          # Full history only to verify a rollback sha is on the branch.
          fetch-depth: ${{ inputs.sha != '' && '0' || '1' }}

      - id: sha
        # A given sha must be on the target's branch: a rollback cannot smuggle another
        # branch's commit into live or stage.
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            full=$(git rev-parse --verify "${{ inputs.sha }}^{commit}")
            git merge-base --is-ancestor "$full" HEAD || {
              echo "::error::${{ inputs.sha }} is not on ${{ steps.t.outputs.branch }}"; exit 1; }
            git checkout -q "$full"
          else
            full=$(git rev-parse HEAD)
          fi
          echo "sha=$full" >> "$GITHUB_OUTPUT"
          echo "Deploying $TARGET: ${{ steps.t.outputs.branch }} @ $full"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: exists
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids imageTag="${{ steps.sha.outputs.sha }}" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "Image already in ECR"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"; echo "No image yet: building it"
          fi

      - if: steps.exists.outputs.found != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # setup-go's cache is keyed on go.sum only and never re-saved on a hit, so it
          # would keep the test job's (CGO) build cache, useless for this static build.
          cache: false

      # Own cache for the static linux build: saved once per go.sum, reused after, so a
      # compile only rebuilds the packages a commit touched.
      - if: steps.exists.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-static-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gobuild-static-${{ runner.os }}-

      - name: Compile
        if: steps.exists.outputs.found != 'true'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server ./cmd/server

      - if: steps.exists.outputs.found != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.sha.outputs.sha }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.t.outputs.branch }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

  # The test gate, in parallel with the build: the deploy waits for both. A rollback to
  # an older commit skips it (that commit already passed when it was first deployed).
  test:
    name: Test
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (inputs.target == 'live' && 'main' || 'stage') }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        # Same gate as build.yml, with the same known-broken test skipped.
        run: go build ./... && go test ./... -skip 'TestVisibleIDsAndHiding'

  deploy:
    name: Deploy to ${{ github.event_name == 'push' && 'stage' || inputs.target }}
    needs: [build, test]
    # Run when the image is ready and the tests passed (or were skipped for a rollback).
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.sha != ''))
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      # Check out the very commit being deployed, so the compose file shipped below
      # matches the image. The box has its own (now stale) git checkout, and relying on
      # it meant compose read an old file with no `image:` line, ignored MDM_IMAGE and
      # restarted the locally built image while reporting success.
      - name: Tests covered this commit
        # Build and test check out the branch independently; refuse to ship if a push
        # landed between them and they looked at different commits.
        if: needs.test.result == 'success'
        run: |
          [ "${{ needs.test.outputs.sha }}" = "${{ needs.build.outputs.sha }}" ] || {
            echo "::error::tested ${{ needs.test.outputs.sha }} but built ${{ needs.build.outputs.sha }}; re-run"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ needs.build.outputs.app_dir }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail

          # Ship the compose file with the deploy, base64'd so no quoting can mangle it.
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          REMOTE=$(cat <<EOF
          set -eu
          cd "$APP_DIR"

          # Keep a copy of whatever is there, then install the version that belongs to
          # this image. Without this the box decides which compose file to run, and it
          # has no way of knowing the image name changed.
          cp -f docker-compose.yml docker-compose.yml.bak 2>/dev/null || true
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          # Persist the tag in .env so a reboot or a manual 'docker compose up' brings
          # back the same image instead of trying to compile on the box.
          if grep -q '^MDM_IMAGE=' .env; then
            sed -i "s|^MDM_IMAGE=.*|MDM_IMAGE=$IMAGE|" .env
          else
            echo "MDM_IMAGE=$IMAGE" >> .env
          fi

          # --force-recreate matters with a floating tag like :main. compose decides
          # whether to restart by comparing the image NAME in its config, not the digest
          # it resolves to — so a second deploy of ':main' pulled the new image and then
          # left the old container running, reporting success. Deploying a SHA avoids
          # this by changing the name, but the flag makes either form correct.
          #
          # --no-build is the other safety net: if the image were somehow missing, compose
          # would otherwise fall back to compiling here, which is the whole problem.
          docker compose up -d --no-build --force-recreate server

          # The proxy owns the host port and must survive the recreate above, so it is
          # brought up separately and never force-recreated. Order matters on the first
          # deploy that introduces it: the OLD server container still publishes the host
          # port, so nginx cannot bind until the recreate above has replaced it with one
          # that does not. `up -d` is a no-op once it is running, and recreates it only
          # when its config actually changed.
          docker compose up -d --no-build proxy

          # Wait for the container to report healthy rather than declaring success the
          # moment it starts.
          # Ask compose which container it just started — the project name differs
          # between the live and stage directories, so nothing here is hardcoded.
          cid=\$(docker compose ps -q server)
          for i in \$(seq 1 30); do
            state=\$(docker inspect -f '{{.State.Health.Status}}' "\$cid" 2>/dev/null || echo starting)
            [ "\$state" = "healthy" ] && break
            sleep 2
          done
          echo "health: \$state"
          running=\$(docker inspect -f '{{.Config.Image}}' "\$cid")
          echo "running image: \$running"
          # The deploy is only real if the container is on the image we just pulled.
          # This is exactly what silently failed twice: a green run over a stale image.
          if [ "\$running" != "$IMAGE" ]; then
            echo "ERROR: expected $IMAGE but the container is running \$running"
            exit 1
          fi
          echo "image digest:  \$(docker inspect -f '{{index .RepoDigests 0}}' "\$(docker inspect -f '{{.Image}}' "\$cid")" 2>/dev/null || echo n/a)"
          echo "started at:    \$(docker inspect -f '{{.State.StartedAt}}' "\$cid")"
          docker compose ps
          docker image prune -f >/dev/null 2>&1 || true
          [ "\$state" = "healthy" ] || exit 1

          # Healthy once is not the same as staying up. On 2026-09-23 the container
          # passed its first check, this step went green, and the kernel OOM-killed it
          # seconds later — live flapped for minutes with a successful deploy on record.
          # HEALTHCHECK's own --start-period=30s means the first pass can land before
          # the startup peak is even over.
          #
          # So soak for 90s: health must stay healthy AND RestartCount must not move.
          # A restart is the signal a kill happened, since the container comes back and
          # looks healthy again afterwards.
          r0=\$(docker inspect -f '{{.RestartCount}}' "\$cid")
          for i in \$(seq 1 18); do
            sleep 5
            s=\$(docker inspect -f '{{.State.Health.Status}}' "\$cid" 2>/dev/null || echo gone)
            r=\$(docker inspect -f '{{.RestartCount}}' "\$cid" 2>/dev/null || echo -1)
            if [ "\$s" != "healthy" ] || [ "\$r" != "\$r0" ]; then
              echo "ERROR: unstable after deploy — health=\$s restarts=\$r0 -> \$r"
              echo "--- last 40 log lines ---"
              docker logs --tail 40 "\$cid" 2>&1 || true
              echo "--- memory ---"
              docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' "\$cid" || true
              exit 1
            fi
          done
          echo "stable for 90s (restarts=\$r0, mem=\$(docker stats --no-stream --format '{{.MemUsage}}' "\$cid" 2>/dev/null))"

          # The container being healthy is not the same as the front door working: the
          # proxy could be down, or pointed at a stale address. Check the host port the
          # ALB actually talks to.
          port=\$(grep -E '^PORT=' .env | cut -d= -f2)
          port=\${port:-8082}
          code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:\$port/health" || echo 000)
          echo "front door http://127.0.0.1:\$port/health -> \$code"
          [ "\$code" = "200" ] || { echo "ERROR: proxy is not serving the app"; docker compose logs --tail 30 proxy; exit 1; }
          EOF
          )

          PARAMS=$(jq -nc --arg s "$REMOTE" '{commands: [$s]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MDM ${{ needs.build.outputs.sha }}" \
            --parameters "$PARAMS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          # Poll rather than `aws ssm wait command-executed`: that waiter gives up after
          # 20 attempts x 5s = 100s, and the remote script now runs longer than that
          # (pull, recreate, health wait, then the 90s stability soak). The waiter
          # timing out left STATUS as InProgress, which reads as a failed deploy even
          # when the deploy was fine. 10 minutes is the cap here.
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "----- STDOUT -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" --query "StandardOutputContent" --output text
          echo "----- STDERR -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" --query "StandardErrorContent" --output text

          echo "Final SSM status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Summary
        if: always()
        run: |
          echo "Deployed **$TARGET**: \`${{ needs.build.outputs.branch }}\` @ \`${{ needs.build.outputs.sha }}\` to \`${{ needs.build.outputs.app_dir }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back by re-running with an earlier commit of that branch in **sha**." >> "$GITHUB_STEP_SUMMARY"
