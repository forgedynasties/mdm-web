# Build, test and publish an image.
#
# Why this exists: the box that runs the MDM is a t2.medium sharing 4GB with several
# other stacks, and compiling the server there needs ~2GB and both vCPUs. Doing that on
# a deploy wedged the instance hard enough to need a reboot, three times in one day. The
# compiler now runs on a GitHub runner and the box only ever pulls an image.
#
# NOT triggered by pushes. deploy.yml builds and publishes the image itself when
# ECR has nothing for the commit being deployed, so a push-triggered build here was a
# second compile of the same code — most of them for commits nobody deployed. Pull
# requests still build and test (that is the gate on the code), and this can be run by
# hand to warm ECR for a commit before deploying it.
#
# This workflow deliberately stops at "image published". Deploying is a separate, manual
# workflow (deploy.yml) so a push can never restart live by itself.
name: Build

on:
  # Every pull request into dev or prod: a release (dev -> prod) must pass this to merge.
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    # A real Postgres, so the *_pg_test.go tests run: without MDM_TEST_DATABASE_URL they
    # skip, and four of them had drifted from the code unnoticed (QA audit, 18 Nov 2026).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mdmci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - id: go
        # Go's minor version from go.mod (1.26), so setup-go takes its newest patch.
        run: echo "version=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        env:
          MDM_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/mdmci?sslmode=disable
        # -p 1: packages that migrate the one database must not run side by side.
        run: go test -p 1 ./...

      - name: Vet
        # Advisory: the tree has pre-existing vet findings, so this reports without
        # failing the build. Tighten once they are cleared.
        continue-on-error: true
        run: go vet ./...

  image:
    name: Publish image to ECR
    # A pull request gets the build and test above but must not publish an image
    # anybody could deploy. A manual run does publish: that is what it is for — warming
    # ECR for a commit so its deploy does not have to compile first.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write # OIDC: no long-lived AWS keys in GitHub
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          # The SHA tag is what deploy.yml takes, so every deploy names an exact commit
          # and a rollback is just an older SHA.
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy it with the **Deploy** workflow, passing this tag." >> "$GITHUB_STEP_SUMMARY"
