<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up your restaurant · AIO</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<style>
body{background:var(--bg);color:var(--text);margin:0}
.frame{border:1px solid var(--border);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:0 18px 50px -24px rgba(0,0,0,.25)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-soft)}
.brand{font-size:18px;color:var(--muted)}.brand b{color:var(--accent)}
.bar .steps{display:flex;gap:6px;margin-left:auto}
.bar .steps span{font-size:12px;padding:4px 10px;border-radius:99px;color:var(--muted);border:1px solid var(--border)}
.bar .steps span.on{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-edge);font-weight:650}
.bar .steps span.done{color:var(--ok);border-color:transparent;background:var(--ok-bg)}
.spark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#7b4bd6,#e0623f);color:#fff;font-size:12px;flex:none}
.btn{border:1px solid var(--border);border-radius:99px;padding:8px 15px;font:inherit;font-size:13px;font-weight:600;background:var(--surface);color:var(--text);cursor:pointer}
.btn.p{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.mut{color:var(--muted)}
/* ── O1 chat + live canvas ─────────────────────────────────────────────── */
.o1{display:grid;grid-template-columns:400px minmax(0,1fr);height:720px}
.chat{border-right:1px solid var(--border-soft);display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,var(--surface),var(--bg))}
.log{flex:1;overflow:auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:9px;align-items:flex-start;max-width:100%}
.msg .bub{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.msg.me{justify-content:flex-end}.msg.me .bub{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;border-radius:14px 14px 4px 14px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:tp 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding-left:31px}
.opt{border:1px solid var(--accent-edge);color:var(--accent-text);background:var(--surface);border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.compose{border-top:1px solid var(--border-soft);padding:10px 12px;display:flex;gap:8px;position:relative}
.compose input{flex:1;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--text)}
.sugg{position:absolute;left:12px;right:12px;bottom:58px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.25);overflow:hidden}
.sugg[hidden]{display:none}
.sugg .pl{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;font-size:13px}
.sugg .pl:hover{background:var(--hover)}
.sugg .pl i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;flex:none}
.sugg .pl small{display:block;color:var(--muted);font-size:11.5px}
.sugg .src{font-size:10.5px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--border-soft);text-align:right}
.stage{position:relative;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.found{margin:18px;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:16px;display:flex;gap:14px;align-items:flex-start}
.found .pic{width:84px;height:84px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff}
.found h3{margin:0 0 2px;font-size:18px}
.found .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.found .facts span{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:3px 9px;color:var(--text-2)}
.idle{flex:1;display:grid;place-items:center;color:var(--muted);font-size:13.5px;text-align:center;padding:30px}
/* planner */
.planner{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:0}
.pl-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-soft);background:var(--surface)}
.tool{border:1px solid var(--border);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--text-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tool i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.tools .sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.canvas{flex:1;min-height:0;overflow:auto;padding:14px;display:grid;place-items:center}
svg.plan{background:#fff;border:1px solid var(--border);border-radius:14px;touch-action:none;cursor:crosshair;max-width:100%;height:auto}
html[data-theme="dark"] svg.plan{background:#1d1b22}
.room rect{stroke-width:2}
.room text{font:600 12px Poppins,system-ui;fill:#3b3540;pointer-events:none}
.room.sel rect{stroke:#cf4529!important;stroke-width:3}
.dev{cursor:grab}
.dev circle{stroke:#fff;stroke-width:2}
.dev text{font:700 9px Poppins,system-ui;fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.dev.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.tbl{fill:#f0ece8;stroke:#c9bfb6;stroke-width:1.5}
.side{border-left:1px solid var(--border-soft);background:var(--surface);overflow:auto;padding:14px}
.side h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pkgs{display:grid;gap:6px;margin-bottom:14px}
.pkg{border:1px solid var(--border);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:13px;text-align:left;background:var(--surface);font-family:inherit;color:var(--text)}
.pkg b{display:block}.pkg small{color:var(--muted);font-size:11.5px}
.pkg.on{border-color:var(--accent);background:var(--accent-soft)}
.dl{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border-soft);font-size:13px}
.dl:first-child{border-top:0}
.dl .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:800;flex:none}
.dl .n{margin-left:auto;font-family:var(--mono);font-weight:700}
.dl .stp{display:flex;gap:2px}.dl .stp button{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text);font:inherit;font-size:13px;line-height:1}
.why{font-size:12px;color:var(--text-2);line-height:1.5;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:12px}
.why b{color:var(--text)}
.hint{font-size:12px;color:var(--muted);padding:6px 14px;border-top:1px solid var(--border-soft);background:var(--surface)}
/* ── O2 / O3 screens ───────────────────────────────────────────────────── */
.scr{padding:28px 32px}
.wz{max-width:760px;margin:0 auto}
.wz h2{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.big{width:100%;border:1.5px solid var(--border);border-radius:16px;padding:16px 18px;font:inherit;font-size:16px;background:var(--surface);color:var(--text)}
.qcard{border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px;background:var(--surface)}
.qcard .q{font-weight:650;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg span{border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer}.seg span.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.ai{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--accent-edge);background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin-top:14px;font-size:13px}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.tpl{border:1px solid var(--border);border-radius:16px;padding:10px;background:var(--surface);cursor:pointer}
.tpl.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tpl b{display:block;font-size:13px;margin-top:6px}.tpl small{color:var(--muted);font-size:11.5px}
.pk3{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.pk3 .c{border:1px solid var(--border);border-radius:16px;padding:14px;background:var(--surface)}
.pk3 .c.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pk3 ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--text-2);line-height:1.6}
.tplc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;flex-wrap:nowrap;gap:5px;padding:8px 12px 0;border-top:1px solid var(--border-soft);overflow-x:auto}
.acts .opt{padding:5px 10px;font-size:12px;white-space:nowrap;flex:none}
.stage{overflow:auto}
.found.sm{margin:10px 14px 0;padding:8px 12px;align-items:center}
.found.sm .pic{width:40px;height:40px;border-radius:10px;font-size:16px}
.found.sm h3{font-size:15px}
.found.sm .facts{margin-top:4px}.found.sm .facts span{font-size:11px;padding:2px 7px}
.acts[hidden]{display:none}
.tpl-hand{border-style:dashed!important}
.acts .opt.ai{background:var(--accent-soft)}
.acts .opt.go{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;margin-left:auto}
.tpl-ai{grid-column:1/-1;display:flex;gap:10px;align-items:center;border-color:var(--accent-edge)!important;background:var(--accent-soft)!important}
.tpl-ai .spark{width:28px;height:28px;border-radius:9px}
.tplb{border:1px solid var(--border);border-radius:14px;padding:8px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--text)}
.tplb:hover{border-color:var(--accent-edge)}.tplb.rec{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tplb svg{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
.tplb b{display:block;font-size:12.5px;margin-top:5px}.tplb small{font-size:11px;color:var(--muted)}
.found .facts a{color:var(--accent-text)}
.q2{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;margin-top:18px;font-size:13.5px;line-height:1.55;color:var(--text-2)}
.q2 h2{margin:0 0 6px;font-size:15px;color:var(--text)}.q2 ol{margin:0;padding-left:20px}.q2 li{margin:5px 0}.q2 b{color:var(--text)}
@media(max-width:1000px){.o1{grid-template-columns:1fr;height:auto}.chat{height:520px}.planner{grid-template-columns:1fr}.tpls,.pk3{grid-template-columns:1fr 1fr}}

.tno{font:600 8px Poppins,system-ui;fill:#8a8178;text-anchor:middle;pointer-events:none}
.dl .dn{display:flex;flex-direction:column;line-height:1.25}.dl .dn small{font-size:11px;color:var(--muted)}
body{min-height:100vh}
.wrap{max-width:1440px;margin:0 auto;padding:18px 20px 40px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0 0 10px}
.demo-tag b{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:99px}
</style>
</head>
<body>
<!-- Restaurant onboarding, a public demo (4 Nov 2026; user: "implement the demo on
     /restaurant-onboarding-demo no sign in gate"). O1 "AI concierge": find the restaurant
     (Places, mocked here), a short survey, an AI-drafted floor plan with devices placed by rule,
     packages. Nothing is saved and no API is called. Served by OnboardingDemo. -->
<div class="wrap">
<div class="demo-tag"><b>Demo</b> nothing here is saved</div>
<div class="frame">
      <div class="bar"><span class="brand"><b>AIO</b> · Set up your restaurant</span><div class="steps" id="o1-steps"><span class="on">Find</span><span>About you</span><span>Floor plan</span><span>Devices</span><span>Account</span></div></div>
      <div class="o1">
        <div class="chat">
          <div class="log" id="log"></div>
          <div class="acts" id="acts" hidden></div>
          <div class="compose">
            <div class="sugg" id="sugg" hidden></div>
            <input id="q" placeholder="City or ZIP, e.g. Las Vegas" autocomplete="off">
            <button class="btn p" id="send">Send</button>
          </div>
        </div>
        <div class="stage" id="stage">
          <div class="idle" id="idle"><div><span class="spark" style="width:44px;height:44px;border-radius:14px;font-size:22px">✦</span><p style="margin:12px 0 0">Your restaurant will appear here.<br>Start by typing its name on the left.</p></div></div>
        </div>
      </div>
    </div>
  
</div>
<script>
// ─── O1: the concierge ────────────────────────────────────────────────────────
(function () {
  var PLACES = [
    { n: 'Flights Vegas', a: '3726 Planet Hollywood Way, Las Vegas, NV', c: '#e0623f', r: '4.5', t: 'American · sports bar', h: 'Open 11:00 – 02:00', p: '(702) 555-0142' },
    { n: 'Flights Restaurant Phoenix', a: '2501 E Camelback Rd, Phoenix, AZ', c: '#6a3fd0', r: '4.4', t: 'American', h: 'Open 11:00 – 22:00', p: '(602) 555-0110' },
    { n: "Huanchaco Peruvian Food", a: '6101 Lone Tree Way, Brentwood, CA', c: '#1d7a43', r: '4.7', t: 'Peruvian', h: 'Open 11:00 – 21:00', p: '(925) 555-0188' },
    { n: "Mom's Biryani", a: '41 Main St, Fremont, CA', c: '#b7791f', r: '4.6', t: 'Indian', h: 'Open 11:30 – 22:30', p: '(510) 555-0175' },
    { n: 'Tacos El Compa', a: '980 E Santa Clara St, San Jose, CA', c: '#c53030', r: '4.5', t: 'Mexican · counter', h: 'Open 09:00 – 23:00', p: '(408) 555-0101' },
    { n: 'Ah Huevo - Pleasanton', a: '4515 Rosewood Dr, Pleasanton, CA', c: '#d69e2e', r: '4.3', t: 'Breakfast · counter', h: 'Open 07:00 – 15:00', p: '(925) 555-0120' }
  ];
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var log = document.getElementById('log'), q = document.getElementById('q'), sugg = document.getElementById('sugg');
  var stage = document.getElementById('stage'), steps = document.getElementById('o1-steps').children;
  var S = { place: null, service: null, tables: 16, extras: [], kitchens: 2 };
  function step(i) { for (var k = 0; k < steps.length; k++) { steps[k].className = k < i ? 'done' : k === i ? 'on' : ''; if (k < i) steps[k].textContent = '✓ ' + steps[k].textContent.replace('✓ ', ''); } }
  function scroll() { log.scrollTop = log.scrollHeight; }
  function me(t) { var m = document.createElement('div'); m.className = 'msg me'; m.innerHTML = '<div class="bub"></div>'; m.firstChild.textContent = t; log.appendChild(m); scroll(); }
  // The assistant "types" for a moment, then streams its line in.
  function ai(html, opts, then) {
    var m = document.createElement('div'); m.className = 'msg'; m.innerHTML = '<span class="spark">✦</span><div class="bub"><span class="typing"><span></span><span></span><span></span></span></div>';
    log.appendChild(m); scroll();
    setTimeout(function () {
      var bub = m.querySelector('.bub'); bub.innerHTML = '';
      var tmp = document.createElement('div'); tmp.innerHTML = html; var text = tmp.innerHTML, i = 0;
      var iv = setInterval(function () {
        i = Math.min(text.length, i + 4); while (text[i - 1] === '<') { i = text.indexOf('>', i) + 1; }
        bub.innerHTML = text.slice(0, i); scroll();
        if (i >= text.length) { clearInterval(iv); if (opts) choices(opts); if (then) then(); }
      }, 16);
    }, 650);
  }
  function choices(opts) {
    var box = document.createElement('div'); box.className = 'opts';
    opts.forEach(function (o) { var b = document.createElement('button'); b.className = 'opt'; b.textContent = o.t; b.onclick = function () { box.remove(); me(o.t); o.f(); }; box.appendChild(b); });
    log.appendChild(box); scroll();
  }
  // ── 1. find it ──
  // First where (user, 4 Nov 2026: "we should ask where restaurant is so that the search is
  // narrow"): a city or ZIP, or the browser's location; the name search then stays within
  // about 40 km of it (the server's /where and /places).
  function askWhere() {
    ai("Hi! I'll set up AIO for your restaurant in about two minutes. First, <b>where is it?</b> A city or ZIP is enough.",
      [{ t: '📍 Use my location', f: useMyLocation }, { t: 'Skip', f: function () { S.area = { name: '' }; askName(); } }]);
  }
  function useMyLocation() {
    if (!navigator.geolocation) { ai("Your browser won't share its location. Type a city or ZIP instead."); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      S.area = { name: 'near you', lat: pos.coords.latitude, lng: pos.coords.longitude }; askName();
    }, function () { ai("I couldn't get your location. Type a city or ZIP instead."); }, { timeout: 8000 });
  }
  function where(t) {
    me(t);
    fetch('/restaurant-onboarding-demo/where?q=' + encodeURIComponent(t))
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        if (!d.found) { ai("I couldn't find <b>" + esc(t) + "</b>. Try a city name or a ZIP."); return; }
        S.area = { name: d.name, lat: d.lat, lng: d.lng }; askName();
      })
      .catch(function () { S.area = { name: t }; askName(); });
  }
  function askName() {
    var o = log.querySelector('.opts:last-child'); if (o) o.remove();
    q.placeholder = "Your restaurant's name…"; q.value = ''; q.focus();
    ai((S.area.name ? 'Got it, <b>' + esc(S.area.name) + '</b>. ' : '') + "<b>What's your restaurant called?</b> I'll look " + (S.area.lat ? 'around there' : 'for it') + ' on Google.');
  }
  askWhere();
  // Google Places through the server (/restaurant-onboarding-demo/places and /place); the
  // key never reaches the page. Without a key on the server (404) the sample list stands in.
  var SESSION = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)), live = true, seq = 0, timer = null, shown = [];
  var COLORS = ['#e0623f', '#6a3fd0', '#1d7a43', '#b7791f', '#c53030', '#2f6db5', '#0f5c4c'];
  function colorOf(n) { var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }
  function list(items, src) {
    shown = items;
    sugg.innerHTML = items.map(function (p, i) { return '<div class="pl" data-i="' + i + '"><i style="background:' + (p.c || colorOf(p.n)) + '">' + esc(p.n[0] || '?') + '</i><span><b>' + esc(p.n) + '</b><small>' + esc(p.a) + '</small></span></div>'; }).join('') +
      (items.length ? '<div class="src">' + src + '</div>' : '<div class="pl" data-manual="1"><span><b>Not listed?</b><small>Add it by hand: name and address</small></span></div>');
    sugg.hidden = false;
  }
  function sample(t) { list(PLACES.filter(function (p) { return p.n.toLowerCase().indexOf(t) >= 0 || p.a.toLowerCase().indexOf(t) >= 0; }).slice(0, 5), 'sample list (no Places key on this server)'); }
  q.addEventListener('input', function () {
    var t = q.value.trim().toLowerCase();
    if (S.place || !S.area || t.length < 2) { sugg.hidden = true; return; }
    if (!live) { sample(t); return; }
    clearTimeout(timer);
    timer = setTimeout(function () {
      var my = ++seq;
      fetch('/restaurant-onboarding-demo/places?q=' + encodeURIComponent(q.value.trim()) + '&s=' + SESSION + (S.area && S.area.lat ? '&lat=' + S.area.lat + '&lng=' + S.area.lng : ''))
        .then(function (r) { if (r.status === 404) { live = false; throw 0; } if (!r.ok) throw 0; return r.json(); })
        .then(function (d) { if (my === seq && !S.place) list(d.places || [], 'from Google Maps'); })
        .catch(function () { if (my === seq && !S.place) sample(t); });
    }, 220);
  });
  sugg.addEventListener('click', function (e) {
    var r = e.target.closest('[data-i]');
    if (r) { var p = shown[+r.dataset.i]; if (p.id) details(p); else pick(p); return; }
    if (e.target.closest('[data-manual]')) { var n = q.value.trim(); pick({ n: n, a: 'Address to add', c: colorOf(n), r: '', t: 'Restaurant', h: '', p: '' }); }
  });
  function details(p) {
    sugg.hidden = true; q.value = ''; me(p.n);

    find('kitchen').forEach(function (k) { if (on.indexOf('kds') < 0) return; var n = Math.max(2, Math.round(S.tables / 10)); for (var i = 0; i < n; i++) devs.push({ t: 'kds', x: k.x + k.w * (i + 1) / (n + 1), y: k.y + 18 }); });
    find('counter').forEach(function (c) {
      if (on.indexOf('pos') >= 0) { var n = S.tables > 20 ? 2 : 1; for (var i = 0; i < n; i++) devs.push({ t: 'pos', x: c.x + c.w * (i + 1) / (n + 1), y: c.y + c.h - 22 }); }
      if (on.indexOf('mpos') >= 0) { var m = Math.max(2, Math.round(S.tables / 6)); for (var j = 0; j < m; j++) devs.push({ t: 'mpos', x: c.x + 20 + j * 24, y: c.y + c.h / 2 - 4 }); }
      if (on.indexOf('menu') >= 0) for (var k2 = 0; k2 < 2; k2++) devs.push({ t: 'menu', x: c.x + c.w * (k2 + 1) / 3, y: c.y + 14 });
    });
    find('bar').forEach(function (b) { if (on.indexOf('pos') >= 0) devs.push({ t: 'pos', x: b.x + b.w - 24, y: b.y + b.h - 22 }); });
    find('entrance').forEach(function (e) { if (on.indexOf('kiosk') >= 0) { var n = S.tables > 20 ? 2 : 1; for (var i = 0; i < n; i++) devs.push({ t: 'kiosk', x: e.x + e.w * (i + 1) / (n + 1), y: e.y + e.h / 2 }); } });
    draw(animate); side();
  }
  function draw(animate) {
    var h = '<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(0,0,0,.05)"/></pattern></defs><rect width="' + W + '" height="' + H + '" fill="url(#g)"/>';
    rooms.forEach(function (r, i) { h += '<g class="room' + (i === sel ? ' sel' : '') + '" data-r="' + i + '"><rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" rx="10" fill="' + T[r.t].c + '" stroke="' + T[r.t].s + '"/><text x="' + (r.x + 10) + '" y="' + (r.y + r.h - 10) + '">' + T[r.t].n + '</text></g>'; });
    tables.forEach(function (t) { h += t.bar ? '<circle class="tbl" cx="' + t.x + '" cy="' + (t.y + (t.side ? 0 : 12)) + '" r="5"/>' : '<circle class="tbl" cx="' + t.x + '" cy="' + t.y + '" r="' + t.r + '"/><text class="tno" x="' + t.x + '" y="' + (t.y + t.r + 9) + '">' + t.no + '</text>'; });
    devs.forEach(function (d, i) { var dd = D[d.t]; h += '<g class="dev' + (animate ? ' pop' : '') + '" data-d="' + i + '" style="transform-origin:' + d.x + 'px ' + d.y + 'px;animation-delay:' + (animate ? i * 18 : 0) + 'ms"><circle cx="' + d.x + '" cy="' + d.y + '" r="10" fill="' + dd.c + '"/><text x="' + d.x + '" y="' + d.y + '">' + dd.k + '</text><title>' + dd.n + ' · ' + dd.hw + (d.at ? ' · on ' + d.at : '') + '</title></g>'; });
    svg.innerHTML = h;
  }
  function side() {
    var el = document.getElementById('side'); if (!el) return;
    var counts = {}; devs.forEach(function (d) { counts[d.t] = (counts[d.t] || 0) + 1; });
    var h = '<h4>Package</h4><div class="pkgs">' + Object.keys(PK).map(function (k) { return '<button class="pkg' + (S.pkg === k ? ' on' : '') + '" data-p="' + k + '"><b>' + PK[k].n + '</b><small>' + PK[k].d + '</small></button>'; }).join('') + '</div>';
    h += '<h4>Devices · ' + devs.length + '</h4>' + Object.keys(D).map(function (k) { return '<div class="dl"><span class="ic" style="background:' + D[k].c + '">' + D[k].k + '</span>' + D[k].n + '<span class="n">' + (counts[k] || 0) + '</span><span class="stp"><button data-m="' + k + '">−</button><button data-a="' + k + '">+</button></span></div>'; }).join('');
    var n = counts.nugget || 0;
    h += '<div class="why"><span class="spark" style="width:18px;height:18px;font-size:10px;vertical-align:-3px">✦</span> <b>Why:</b> ' + (n ? n + ' Tableside AI tablets: one on each table, one per three seats at the bar, so guests order and pay without waiting. ' : '') + (counts.kds ? counts.kds + ' kitchen screens along the kitchen wall, about one per 10 tables. ' : '') + (counts.pos ? counts.pos + ' POS at the ' + (rooms.some(function (r) { return r.t === 'bar'; }) ? 'counter and the bar. ' : 'counter. ') : '') + (counts.mpos ? counts.mpos + ' handhelds for servers, parked at the counter. ' : '') + (counts.kiosk ? counts.kiosk + ' kiosks by the entrance for walk-ins. ' : '') + (counts.menu ? counts.menu + ' menu boards above the counter.' : '') + '</div>';
    el.innerHTML = h;
    el.onclick = function (e) {
      var p = e.target.closest('[data-p]'); if (p) { S.pkg = p.dataset.p; if (S.pkg !== 'custom') suggest(true); else side(); return; }
      var a = e.target.closest('[data-a]'), m = e.target.closest('[data-m]');
      if (a) { S.pkg = 'custom'; var r = rooms[0]; devs.push({ t: a.dataset.a, x: r.x + 30 + Math.random() * (r.w - 60), y: r.y + 30 + Math.random() * (r.h - 60) }); draw(false); side(); }
      if (m) { S.pkg = 'custom'; for (var i = devs.length - 1; i >= 0; i--) if (devs[i].t === m.dataset.m) { devs.splice(i, 1); break; } draw(false); side(); }
    };
  }
  function wire() {
    var drag = null;
    function pt(e) { var r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
    svg.addEventListener('pointerdown', function (e) {
      var p = pt(e), dv = e.target.closest('.dev'), rm = e.target.closest('.room');
      svg.setPointerCapture(e.pointerId);
      if (tool === 'move' && dv) { drag = { k: 'dev', i: +dv.dataset.d, ox: p.x - devs[+dv.dataset.d].x, oy: p.y - devs[+dv.dataset.d].y }; return; }
      if (tool === 'move' && rm) { var i = +rm.dataset.r; sel = i; drag = { k: 'room', i: i, ox: p.x - rooms[i].x, oy: p.y - rooms[i].y, sx: rooms[i].x, sy: rooms[i].y }; draw(false); return; }
      if (tool !== 'move') { var r = { t: tool, x: snap(p.x), y: snap(p.y), w: 20, h: 20 }; rooms.push(r); sel = rooms.length - 1; drag = { k: 'new', i: sel, x0: r.x, y0: r.y }; draw(false); }
    });
    svg.addEventListener('pointermove', function (e) {
      if (!drag) return; var p = pt(e);
      if (drag.k === 'dev') { devs[drag.i].x = p.x - drag.ox; devs[drag.i].y = p.y - drag.oy; draw(false); }
      if (drag.k === 'room') {
        var r = rooms[drag.i], nx = snap(p.x - drag.ox), ny = snap(p.y - drag.oy), dx = nx - r.x, dy = ny - r.y;
        r.x = nx; r.y = ny;
        tables.forEach(function (t) { if (t.room === drag.i) { t.x += dx; t.y += dy; } });
        devs.forEach(function (d) { if (d.x > r.x - dx && d.x < r.x - dx + r.w && d.y > r.y - dy && d.y < r.y - dy + r.h) { d.x += dx; d.y += dy; } });
        draw(false);
      }
      if (drag.k === 'new') { var rr = rooms[drag.i], x1 = snap(p.x), y1 = snap(p.y); rr.x = Math.min(drag.x0, x1); rr.y = Math.min(drag.y0, y1); rr.w = Math.max(40, Math.abs(x1 - drag.x0)); rr.h = Math.max(40, Math.abs(y1 - drag.y0)); draw(false); }
    });
    svg.addEventListener('pointerup', function () {
      if (drag && drag.k === 'new') { var r = rooms[drag.i]; if (r.t === 'dining' || r.t === 'patio' || r.t === 'bar') fillTables(); suggest(true);
        ai('Added a <b>' + T[r.t].n.toLowerCase() + '</b> (' + Math.round(r.w / 20) + ' × ' + Math.round(r.h / 20) + ' squares) and placed devices for it.'); }
      drag = null;
    });
    document.addEventListener('keydown', function (e) {
      if ((e.key === 'Delete' || e.key === 'Backspace') && sel >= 0 && document.activeElement === document.body) { rooms.splice(sel, 1); sel = -1; fillTables(); suggest(false); }
    });
  }
})();
