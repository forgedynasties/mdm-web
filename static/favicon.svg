<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Hub ring: the fleet around one place. Two round shapes on the brand gradient
       (periwinkle → coral, the wordmark's ramp) — chosen because it is the one icon
       that cannot fail at the 16px a browser tab actually draws. See favicon-demos.html, J. -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a80f6"/><stop offset="1" stop-color="#f9674e"/></linearGradient></defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="2.6"/>
  <circle cx="16" cy="16" r="3" fill="#fff"/>
</svg>
