<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIO Enroll · next ideas</title>
<style>
/* AIO Enroll — macOS "System Settings" look.
   Self-contained: no dashboard stylesheet, no web fonts. The tokens at the top also feed
   guide.css (phone illustration, adb help, Wi-Fi panel). */

:root {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Inter", Cantarell, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --bg: #ffffff;               /* detail area */
  --side: #ececf0;             /* sidebar (solid when the OS has no vibrancy) */
  --side-glass: rgba(236, 236, 240, .55);
  --text: #1d1d1f;
  --muted: #6e6e73;
  --text-faint: #8e8e93;
  --sep: rgba(0, 0, 0, .1);
  --group: #f5f5f7;            /* grouped rows background */
  --row: #ffffff;
  --hover: rgba(0, 0, 0, .05);
  --press: rgba(0, 0, 0, .09);
  --accent: #f9674e;           /* AIO coral: selection + the one primary button */
  --accent-text: #c4432a;
  --accent-soft: rgba(249, 103, 78, .14);
  --accent-edge: rgba(249, 103, 78, .4);
  --sel: rgba(249, 103, 78, .16);
  --ok: #248a3d; --ok-solid: #34c759; --ok-bg: rgba(52, 199, 89, .14); --ok-edge: rgba(52, 199, 89, .35);
  --warn: #b25000; --warn-solid: #ff9f0a; --warn-bg: rgba(255, 159, 10, .15); --warn-edge: rgba(255, 159, 10, .4);
  --danger: #d70015; --danger-solid: #ff3b30; --danger-bg: rgba(255, 59, 48, .12); --danger-edge: rgba(255, 59, 48, .35);
  --link: #0a6cdf;
  /* names guide.css uses */
  --surface: var(--row); --surface2: var(--group); --surface-3: #e8e8ed;
  --border: rgba(0, 0, 0, .13); --border-soft: var(--sep);
  --shadow-pop: 0 18px 50px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .14);
  --ease: cubic-bezier(.2, .9, .25, 1);
  --spring: cubic-bezier(.3, 1.5, .5, 1);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1e1e20; --side: #2a2a2d; --side-glass: rgba(40, 40, 44, .55);
  --text: #f5f5f7; --muted: #98989d; --text-faint: #7c7c80;
  --sep: rgba(255, 255, 255, .1); --group: #2a2a2d; --row: #323236;
  --hover: rgba(255, 255, 255, .06); --press: rgba(255, 255, 255, .1);
  --accent-text: #ff9a83; --accent-soft: rgba(249, 103, 78, .2); --sel: rgba(249, 103, 78, .26);
  --ok: #30d158; --ok-solid: #30d158; --ok-bg: rgba(48, 209, 88, .16);
  --warn: #ffb340; --warn-solid: #ff9f0a; --warn-bg: rgba(255, 159, 10, .16);
  --danger: #ff6961; --danger-solid: #ff453a; --danger-bg: rgba(255, 69, 58, .16);
  --link: #4ea1ff;
  --surface-3: #3a3a3e; --border: rgba(255, 255, 255, .14);
  --shadow-pop: 0 18px 50px rgba(0, 0, 0, .6), 0 0 0 .5px rgba(255, 255, 255, .12);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.38 var(--font); color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; overflow: hidden;
}
input, .mono, .selectable { -webkit-user-select: text; user-select: text; }
.mono { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.sp { flex: 1; }
.ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, .35); border: 3px solid transparent; background-clip: padding-box; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(128, 128, 128, .55); }
::-webkit-scrollbar-track { background: transparent; }

/* ── controls ───────────────────────────────────────────────────────────── */
.cc-btn {
  font: inherit; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--text);
  background: var(--row); border: 0; border-radius: 7px; padding: 4px 14px; min-height: 26px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: default;
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .2), 0 1px 1px rgba(0, 0, 0, .06);
  transition: transform .1s, filter .15s, background .15s;
}
html[data-theme="dark"] .cc-btn { background: #4a4a4e; box-shadow: 0 0 0 .5px rgba(255, 255, 255, .06); }
html[data-theme="dark"] .cc-btn.primary { background: var(--accent); color: #fff; }
html[data-theme="dark"] .cc-btn.primary:disabled { background: var(--surface-3); color: var(--muted); }
.cc-btn:hover { filter: brightness(.98); }
.cc-btn:active { transform: scale(.97); filter: brightness(.94); }
.cc-btn.primary { background: var(--accent); color: #fff; box-shadow: 0 1px 1px rgba(0, 0, 0, .12), inset 0 .5px 0 rgba(255, 255, 255, .25); }
.cc-btn.primary:hover { filter: brightness(1.05); }
.cc-btn:disabled { opacity: .45; transform: none; filter: none; }
.cc-btn.primary:disabled { background: var(--surface-3); color: var(--muted); box-shadow: none; opacity: 1; }
.cc-btn.sm { font-size: 12px; padding: 2px 10px; min-height: 22px; border-radius: 6px; }
.cc-btn.lg { font-size: 13px; padding: 6px 22px; min-height: 30px; }
.lnk { font: inherit; font-size: 13px; color: var(--link); background: none; border: 0; padding: 2px 4px; border-radius: 5px; cursor: default; display: inline-flex; align-items: center; gap: 5px; }
.lnk:hover { background: var(--hover); }
.lnk.danger { color: var(--danger); }
.lnk .ic { width: 13px; height: 13px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: rot .7s linear infinite; display: inline-block; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.check { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .35s .08s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateX(-8px); max-height: 0; } to { opacity: 1; transform: none; max-height: 60px; } }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
@keyframes pulse { 50% { opacity: .35; } }
.err { color: var(--danger); font-size: 12px; margin: 0; min-height: 1em; }
.wmsg { font-size: 12px; margin-top: 10px; padding: 8px 11px; border-radius: 8px; line-height: 1.45; background: var(--group); animation: fadeUp .25s var(--ease) both; -webkit-user-select: text; user-select: text; }
.wmsg.ok { background: var(--ok-bg); color: var(--ok); }
.wmsg.bad { background: var(--danger-bg); color: var(--danger); }
.wdet { margin-top: 6px; font-size: 11px; opacity: .85; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 99px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.pill .ic { width: 12px; height: 12px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--danger-bg); color: var(--danger); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.pop { animation: pop .4s var(--spring) both; }
.sk { background: linear-gradient(90deg, var(--hover) 25%, var(--press) 50%, var(--hover) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* switch (Only ours) */
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.sw i { width: 26px; height: 15px; border-radius: 9px; background: rgba(120, 120, 128, .32); position: relative; transition: background .2s; display: block; }
.sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .22s var(--ease); }
.sw.on i { background: var(--ok-solid); }
.sw.on i::after { transform: translateX(11px); }

/* ── sign in / account picker ───────────────────────────────────────────── */
.gate { height: 100%; display: flex; align-items: center; justify-content: center; padding: 30px; background: var(--group); }
html[data-theme="dark"] .gate { background: var(--bg); }
.logo { display: block; width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 14px; box-shadow: 0 6px 18px rgba(10, 95, 216, .32); }
.gate h1 { font-size: 22px; text-align: center; }
.gate .sub { color: var(--muted); text-align: center; margin: 4px 0 18px; font-size: 13px; }
.narrow { width: min(360px, 100%); animation: fadeUp .4s var(--ease) both; }
.group.form .row { min-height: 40px; }
.group.form .k { flex: 0 0 82px; }
.group.form input { flex: 1; min-width: 0; font: inherit; border: 0; background: transparent; color: var(--text); outline: none; padding: 6px 0; text-align: right; }
.chk2 { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); margin: 10px 4px 4px; }
.formacts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.formacts .cc-btn { min-width: 84px; }
form.working input { opacity: .6; pointer-events: none; }
.who2 { text-align: center; width: min(720px, 100%); }
.tiles { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; margin-top: 26px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 104px; position: relative; background: none; border: 0; font: inherit; color: var(--text); padding: 0; cursor: default; animation: pop .4s var(--spring) both; }
.tile .av { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #fff; overflow: hidden; position: relative; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); transition: transform .2s var(--ease), box-shadow .2s; }
.tile .av img { width: 100%; height: 100%; object-fit: cover; }
.tile:hover .av, .tile:focus-visible .av { transform: scale(1.06); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent-edge), 0 6px 18px rgba(0, 0, 0, .2); }
.tile:focus { outline: none; }
.tile .nm { font-size: 13px; font-weight: 500; max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .sub2 { font-size: 11px; color: var(--muted); margin-top: -6px; }
.tile.add .av { background: var(--hover); color: var(--muted); box-shadow: none; font-weight: 300; font-size: 34px; border: 1.5px dashed var(--border); }
.tile .rm { position: absolute; top: -2px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--row); color: var(--muted); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); font-size: 13px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; }
.tile:hover .rm { opacity: 1; }
.tile.busy .av::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(0, 0, 0, .35); }
.tile.busy .av::before { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .4); border-top-color: #fff; animation: rot .7s linear infinite; z-index: 1; }

/* ── window layout ──────────────────────────────────────────────────────── */
#app { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
.side { background: var(--side); border-right: .5px solid var(--sep); display: flex; flex-direction: column; min-height: 0; }
html[data-os="mac"] body { background: transparent; }
html[data-os="mac"] .side { background: var(--side-glass); }          /* the window's sidebar vibrancy shows through */
html[data-os="mac"] .main, html[data-os="mac"] .gate { background: var(--bg); }
.side-top { height: 14px; flex: none; }
html[data-os="mac"] .side-top { height: 40px; }                          /* room for the traffic lights */
.side-scroll { flex: 1; overflow: auto; padding: 0 10px 10px; min-height: 0; }
.sec { font-size: 11px; font-weight: 600; color: var(--muted); padding: 12px 10px 4px; display: flex; align-items: center; gap: 6px; }
.sec .count { font-weight: 500; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.sec .sw { margin-left: auto; }
.rail { position: relative; display: flex; flex-direction: column; gap: 1px; }
.rsel { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-radius: 7px; background: var(--sel); opacity: 0; pointer-events: none; transition: transform .3s var(--ease), height .3s var(--ease), opacity .2s; }
.sitem { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; width: 100%; min-height: 30px; padding: 4px 8px; border-radius: 7px; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--text); text-align: left; cursor: default; transition: color .2s; }
.sitem:hover { background: var(--hover); }
.rail .sitem.on { color: var(--accent-text); background: transparent; }
.rail .sitem.on:hover { background: transparent; }
.sitem.in { animation: rowIn .38s var(--ease) both; }
.glyph { width: 22px; height: 22px; border-radius: 6px; background: var(--g, #8e8e93); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .25), 0 .5px 1px rgba(0, 0, 0, .15); }
.glyph .ic { width: 13px; height: 13px; stroke-width: 1.9; }
.sitem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitem .two { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.sitem .two b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitem .two small { font-size: 11px; color: var(--muted); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitem .conn { display: flex; gap: 3px; color: var(--text-faint); }
.sitem .conn .ic { width: 12px; height: 12px; }
.sitem.on .conn { color: var(--accent-text); }
.sitem .stat { width: 16px; display: flex; justify-content: center; flex: none; }
.tick { width: 15px; height: 15px; border-radius: 50%; background: var(--ok-solid); color: #fff; display: flex; align-items: center; justify-content: center; animation: pop .45s var(--spring) both; }
.tick .check { width: 10px; height: 10px; stroke-width: 3.2; }
.sitem i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.sitem i.bad { background: var(--danger-solid); }
.sitem i.wait { background: var(--warn-solid); animation: pulse 1.2s infinite; }
.sitem i.none { background: var(--text-faint); opacity: .5; }
.sitem.skrow { pointer-events: none; }
.sitem.other { opacity: .6; }
.sitem .go { opacity: 0; font-size: 11.5px; color: var(--link); transition: opacity .15s; flex: none; }
.sitem:hover .go, .sitem:focus-visible .go { opacity: 1; }
@media (hover: none) { .sitem .go { opacity: 1; } }
.sitem .x { opacity: 0; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: opacity .15s; flex: none; }
.sitem:hover .x { opacity: 1; }
.sitem .x:hover { background: var(--press); color: var(--text); }
.sitem.pair { background: var(--accent-soft); }
.sitem.pair .go { opacity: 1; color: var(--accent-text); font-weight: 500; }
.disc { width: 12px; height: 12px; color: var(--muted); transition: transform .2s var(--ease); }
.disc.open { transform: rotate(90deg); }
.sec.toggle { cursor: default; border-radius: 6px; }
.sec.toggle:hover { color: var(--text); }
.livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite; }
.nb-chip { display: inline-block; font-size: 10.5px; font-weight: 500; padding: 0 6px; border-radius: 99px; margin-top: 2px; width: fit-content; font-family: var(--font); }
.nb-chip .ic { display: inline-block; width: 9px; height: 9px; vertical-align: -1px; stroke-width: 2.6; }
.nb-chip.fleet { background: var(--ok-bg); color: var(--ok); }
.nb-chip.prod { background: var(--accent-soft); color: var(--accent-text); }
.nb-chip.look { background: var(--warn-bg); color: var(--warn); }
.nb-chip.oth { background: var(--hover); color: var(--muted); }
.side-foot { flex: none; padding: 6px 10px 8px; border-top: .5px solid var(--sep); }
.sitem.addw .nm { color: var(--text); }
.sitem.addw.on { background: var(--sel); color: var(--accent-text); }
.status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding: 6px 8px 0; }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok-solid); animation: pulse 1.6s infinite; }
.status.bad .dot { background: var(--warn-solid); animation: none; }
.rail > .none { font-size: 12px; color: var(--text-faint); padding: 4px 10px 6px; }
.status #today { font-variant-numeric: tabular-nums; }

/* toolbar */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); position: relative; }
.toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 20px; border-bottom: .5px solid var(--sep); }
.tt { min-width: 0; }
.tt .title { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { width: 30px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: default; }
.tbtn:hover { background: var(--hover); color: var(--text); }
.tbtn .ic { width: 17px; height: 17px; }
.helpbtn.hint { color: var(--accent); animation: bob 1.4s infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.acctwrap { position: relative; }
.acct { display: flex; align-items: center; gap: 7px; border: 0; background: transparent; font: inherit; color: var(--text); padding: 3px 8px 3px 3px; border-radius: 99px; cursor: default; }
.acct:hover { background: var(--hover); }
.who { font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pfp { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #7a80f6, #f9674e); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
.pfp img { width: 100%; height: 100%; object-fit: cover; }
.pfp.sk { background: linear-gradient(90deg, var(--hover) 25%, var(--press) 50%, var(--hover) 75%); background-size: 200% 100%; }
.menu { position: absolute; right: 0; top: 34px; min-width: 210px; z-index: 50; padding: 5px; border-radius: 10px; background: color-mix(in srgb, var(--row) 88%, transparent); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: var(--shadow-pop); animation: pop .16s var(--ease) both; transform-origin: top right; }
.mhead { font-size: 11px; color: var(--muted); padding: 5px 9px 6px; border-bottom: .5px solid var(--sep); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; }
.mlabel { font-size: 11px; color: var(--muted); padding: 6px 9px 4px; }
.mseg { display: flex; margin: 0 6px 6px; }
.mseg button { flex: 1; min-width: 0; padding: 3px 8px; }
.msep { height: .5px; background: var(--sep); margin: 4px 4px; }
html.theming, html.theming * { transition: background-color .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s ease, fill .3s, stroke .3s !important; }
.mitem { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text); background: transparent; border: 0; padding: 4px 9px; border-radius: 5px; cursor: default; }
.mitem:hover { background: var(--accent); color: #fff; }
.pbar { height: 2px; flex: none; position: relative; overflow: hidden; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); transition: width .5s var(--ease), opacity .4s; }

/* ── detail (the System Settings pane) ──────────────────────────────────── */
.hero { flex: 1; overflow: auto; min-height: 0; padding: 24px 28px 32px; position: relative; }
.dwrap { max-width: 640px; margin: 0 auto; }
.hero.fade > * { animation: fadeUp .28s var(--ease) both; }
.dhdr { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.dicon { width: 58px; height: 58px; border-radius: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--g, #8e8e93) 82%, #fff), var(--g, #8e8e93)); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .3), 0 2px 6px rgba(0, 0, 0, .15); }
.dicon .ic { width: 30px; height: 30px; stroke-width: 1.5; }
.dicon.done { background: var(--ok-solid); animation: pop .5s var(--spring) both; }
.dicon.done .check { width: 32px; height: 32px; stroke: #fff; stroke-width: 2.6; }
.dhdr h1 { font-size: 20px; }
.dhdr p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.ghead { font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 6px 10px; text-transform: none; }

      bad: 'Kept locally, so it only covers this computer. The dashboard’s “Enrolled by” filter covers the rest.',
      draw: () => win(
        `<div class="sec">Devices <span class="count">0</span></div><div class="rail"><div class="none">Plug in a device to start</div></div><div class="sec">Today</div><div class="rail"><span class="rsel"></span><div class="sitem on"><span class="glyph" style="--g:#34c759">${ICON.clock}</span><span class="nm">Enrolled today</span><span class="count" style="color:var(--muted)">4</span></div></div>`,
        toolbar('Enrolled today', '4 devices · Ali Hassan', `<button class="cc-btn sm">${ICON.copy} Copy Serials</button><button class="cc-btn sm">Export CSV</button>`) +
        `<section class="hero"><div class="dwrap" style="max-width:none"><div class="group"><table class="hist"><tr><th>Time</th><th>Device</th><th>Serial</th><th>Restaurant</th><th>Now</th></tr>${HIST.map((h) => `<tr><td class="mono">${h[0]}</td><td><span class="g"><span class="glyph" style="--g:${GLYPH[h[1]]}">${ICON[h[1]]}</span></span>${h[2]}</td><td class="mono">${h[3]}</td><td>${h[4]}</td><td>${h[5] === 'live' ? pill('ok', 'Online') : pill('warn', 'Not heard from')}</td></tr>`).join('')}</table></div></div></section>`) },
    { k: 'B', label: 'B · Summary sheet on sign-out', rec: false,
      good: 'Zero new pages: you get the recap at the natural end of a session.',
      bad: 'Only when signing out, which people rarely do, and you can’t check it mid-session.',
      draw: () => win(
        `<div class="sec">Devices <span class="count">0</span></div><div class="rail"><div class="none">Plug in a device to start</div></div>`,
        toolbar('AIO Enroll', 'No devices connected') + `<section class="hero"></section>`,
        `<div class="pm-back"><div class="pm-card" style="width:min(440px,92%)"><div class="pm-ic" style="background:var(--ok-solid)">${CHECK.replace('class="check"', 'class="check" style="stroke:#fff;width:26px;height:26px"')}</div><h2>4 devices enrolled today</h2><div class="group" style="width:100%;margin:10px 0 0;text-align:left">${HIST.map((h) => row(`<span class="glyph" style="--g:${GLYPH[h[1]]}">${ICON[h[1]]}</span>${h[2]}`, `<span class="mono">${h[3]}</span>`)).join('')}</div><div class="pm-btns"><button class="cc-btn">Copy Serials</button><button class="cc-btn primary">Sign Out</button></div></div></div>`) },
  ],
  server: 'None for A as shown. The “Now” column re-uses enroll-status.',
});

// ── 6. update agent ──
IDEAS.push({
  id: 'upd', title: 'Update an old agent from the bench', why: 'Lab and returned devices often come back with an old agent (the Pixel 3a XL had 0.2.4). Over USB the app can <b>push the latest agent in a few seconds</b>, with no waiting for the MDM’s self-update.',
  opts: [
    { k: 'A', label: 'Update row in Enrollment', rec: true,
      good: 'Shows only when the agent is behind, so there’s no clutter otherwise. It keeps Device Owner and settings, the same as the silent self-update.',
      bad: 'Overlaps with the MDM’s own update. The bench path is for “now”, the MDM path is for the fleet.',
      draw: (st) => win(
        `<div class="sec">Devices <span class="count">1</span></div><div class="rail"><span class="rsel"></span>${sitem({ ...FLEET[0], on: true, stat: TICK })}</div>`,
        toolbar('SUNMI D2s', 'Enrolled as kds') +
        `<section class="hero"><div class="dwrap">${hdr('kds', 'SUNMI D2s', 'Enrolled as kds · Android 11')}${group('Enrollment', [row('Status', '', pill('ok', '✓ Enrolled')), row('Used as', 'kds'),
          row('Agent', st.u >= 1 ? '0.2.8' : '0.2.4', st.u >= 1 ? pill('ok pop', 'Up to date') : st.u > 0 ? `<span class="upd"><span class="upbar"><i style="width:${st.u * 100}%"></i></span></span>` : `<button class="cc-btn sm primary" data-act="go">${ICON.up} Update to 0.2.8</button>`),
          row('Enrolled by', 'Ali Hassan')])}</div></section>`),
      play: async (st, redraw) => { for (let i = 1; i <= 10; i++) { st.u = i / 10 - .001; redraw(); await sleep(160); } st.u = 1; redraw(); },
      onact: (st, a, play) => { if (a === 'go') play(); },
      init: () => ({ u: 0 }) },
  ],
  server: 'None. The app already downloads the latest agent APK when it enrols.',
});

// ── 7. search + shortcuts ──
const MANY = [{ c: 'kds', name: 'SUNMI D2s', sub: 'D2S2240A0117' }, { c: 'pos', name: 'SUNMI D3 Pro', sub: 'P3121C30418' }, { c: 'kiosk', name: 'ZC-3568K', sub: 'ZC3568K00412' }, { c: 'dongle', name: 'HK1 RBOX D8', sub: 'HK1D8A2209', wifi: true }, { c: 'kiosk', name: 'AIO T7', sub: 'AT070AA2600030', wifi: true }, { c: 'kiosk', name: 'AIO T7', sub: 'AT070AABU00231' }, { c: 'phone', name: 'Pixel 6', sub: '1A2B3C4D5E' }];
IDEAS.push({
  id: 'kbd', title: 'Search and keyboard shortcuts', why: 'On a busy bench the list grows past what fits, and the person enrolling has a phone in one hand. <b>Type part of a serial to jump to it</b>, and use keys for the common actions.',
  opts: [
    { k: 'A', label: 'Filter field + shortcuts', rec: true,
      good: 'Type the last four digits of the serial on the box and it’s selected. Keys: ⌘F search, ↑/↓ move, ⌘↩ Enrol, ⌘⇧W Switch to Wi-Fi.',
      bad: 'Needs a short shortcut list in Help, or no one finds them.',
      draw: (st) => { const q = st.q.toLowerCase(); const hits = MANY.filter((d) => !q || d.sub.toLowerCase().includes(q) || d.name.toLowerCase().includes(q)); const hl = (s) => q ? s.replace(new RegExp(`(${st.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'i'), '<mark>$1</mark>') : s;
        return win(
        `<div class="search">${ICON.search}<input data-q placeholder="Search  ⌘F" value="${st.q}"></div><div class="sec">Devices <span class="count">${hits.length}${q ? ' of ' + MANY.length : ''}</span></div><div class="rail"><span class="rsel"></span>${hits.map((d, i) => sitem({ ...d, name: hl(d.name), sub: hl(d.sub), on: i === 0, stat: '' })).join('') || '<div class="none">No match</div>'}</div>`,
        toolbar(hits[0] ? hits[0].name : 'AIO Enroll', hits[0] ? 'Ready to enrol' : '') + (hits[0] ? `<section class="hero"><div class="dwrap">${hdr(hits[0].c, hits[0].name, 'Ready to enrol')}${group('Enrollment', [row('Status', '', pill('warn', 'Not enrolled')), row('Used as', '', seg(['dongle', 'pos', 'kds', 'kiosk'], hits[0].c === 'phone' ? 'pos' : hits[0].c))])}<div class="dacts"><button class="cc-btn primary lg">Enrol <span class="kbd" style="background:transparent;color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.5)">⌘↩</span></button></div><div class="tip" style="margin-top:22px"><span class="kbd">⌘F</span> search <span class="kbd">↑</span><span class="kbd">↓</span> move <span class="kbd">⌘↩</span> enrol <span class="kbd">⌘⇧W</span> switch to Wi-Fi</div></div></section>` : '<section class="hero"></section>')); },
      init: () => ({ q: '0231' }) },
  ],
  server: 'None.',
});

// ── render ──
const root = document.getElementById('ideas');
document.getElementById('toc').innerHTML = IDEAS.map((x, i) => `<a href="#${x.id}">${i + 1}. ${x.title}</a>`).join('');
IDEAS.forEach((idea, n) => {
  const el = document.createElement('section'); el.className = 'idea'; el.id = idea.id; root.appendChild(el);
  let cur = 0; const states = idea.opts.map((o) => (o.init ? o.init() : {}));
  const draw = () => {
    const o = idea.opts[cur], st = states[cur];
    el.innerHTML = `<h2><span class="num">${n + 1}</span>${idea.title}${idea.opts.some((x) => x.rec) && idea.opts.length > 1 ? '' : ''}</h2><div class="why">${idea.why}</div>
      <div class="ctl">${idea.opts.length > 1 ? `<div class="seg optseg"><span class="th"></span>${idea.opts.map((x, i) => `<button data-o="${i}" class="${i === cur ? 'on' : ''}">${x.label}${x.rec ? ' ★' : ''}</button>`).join('')}</div>` : `<span class="tagw">${o.label}</span>`}
      ${o.rec ? '<span class="tagr">I’d pick this</span>' : ''}${o.play ? '<button class="cc-btn" data-play>▶ Play</button>' : ''}<button class="lnk" data-reset>Reset</button></div>
      <div class="mock">${o.draw(st)}</div>
      <div class="notes"><div><b>GOOD AT</b>${o.good}</div><div><b>WATCH OUT</b>${o.bad}</div></div>
      <div class="notes" style="grid-template-columns:1fr"><div><b>SERVER WORK</b>${idea.server}</div></div>`;
    placeThumbs(el);
    el.querySelectorAll('[data-o]').forEach((b) => b.onclick = () => { cur = +b.dataset.o; draw(); });
    const play = async () => { if (st.busy) return; st.busy = true; try { await o.play(st, () => { el.querySelector('.mock').innerHTML = o.draw(st); placeThumbs(el); wire(); }); } finally { st.busy = false; } };
    const wire = () => {
      el.querySelectorAll('.mock [data-act]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); const a = b.dataset.act; if (a === 'go' && o.play && !o.onact) return play(); o.onact && o.onact(st, a, play); if (!st.busy) { el.querySelector('.mock').innerHTML = o.draw(st); placeThumbs(el); wire(); } });
      const q = el.querySelector('[data-q]'); if (q) { q.removeAttribute('readonly'); q.oninput = () => { st.q = q.value; const pos = q.selectionStart; el.querySelector('.mock').innerHTML = o.draw(st); placeThumbs(el); wire(); const nq = el.querySelector('[data-q]'); nq.focus(); nq.setSelectionRange(pos, pos); }; }
    };
    wire();
    const pb = el.querySelector('[data-play]'); if (pb) pb.onclick = play;
    el.querySelector('[data-reset]').onclick = () => { if (st.busy) return; states[cur] = o.init ? o.init() : {}; draw(); };
  };
  draw();
});

// theme
const ts = document.getElementById('themeSeg');
ts.querySelectorAll('button').forEach((b) => b.onclick = () => {
  document.documentElement.classList.add('theming');
  ts.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  document.documentElement.dataset.theme = b.dataset.t; placeThumbs(document);
  setTimeout(() => document.documentElement.classList.remove('theming'), 350);
});
if (matchMedia('(prefers-color-scheme: dark)').matches) ts.querySelector('[data-t=dark]').click();
requestAnimationFrame(() => placeThumbs(document));
addEventListener('resize', () => placeThumbs(document));
</script>
</body></html>
